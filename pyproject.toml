[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-hub"
version = "0.1.0"
description = "S01 incremental application foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.5",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "python-dotenv==1.2.4",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.0.57",
  "PyMySQL[rsa]==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "alembic==1.20.1", "setuptools==84.2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

