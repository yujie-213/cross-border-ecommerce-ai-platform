<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>序衡 S01 · 采购补货工作台（UX v3 原型）</title>
<style>
:root{
  --canvas:#f4f6f8;--surface:#fff;--ink:#202d3a;--muted:#5c6b79;--subtle:#71808e;--line:#e0e5eb;
  --control:#8996a3;--primary:#126b65;--primary-hover:#0b5651;--primary-active:#08443f;--selected:#e9f3f1;
  --nav:#172c3c;--success:#24664b;--success-bg:#edf6ef;--warning:#8a510b;--warning-bg:#fff4e2;
  --danger:#ad3733;--danger-bg:#fcefee;--info:#315e8f;--info-bg:#eef4fb;--radius:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.6 "Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:25px;line-height:1.4;letter-spacing:-.4px;font-weight:650}
h2{font-size:15px;font-weight:600}
h3{font-size:13px;font-weight:600}
a{color:var(--primary);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{cursor:pointer;transition:background .12s}
button:disabled{cursor:not-allowed;background:#f0f2f4!important;color:#667380!important;border-color:#d6dde3!important}
:focus-visible{outline:2px solid #276aaf;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.skip{position:fixed;top:-80px;left:8px;z-index:60;background:#fff;padding:10px 14px;border:1px solid var(--line)}
.skip:focus{top:8px}
.mono{font-family:Consolas,monospace;font-size:12px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* ---------- shell ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:220px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px 16px;z-index:20}
.brand{display:flex;gap:10px;align-items:center;color:var(--nav);font-size:21px;font-weight:650;padding:0 8px;text-decoration:none}
.brand:hover{text-decoration:none}
.brand-symbol{display:grid;place-items:center;width:34px;height:38px;background:var(--nav);color:#fff;font-size:19px;border-radius:9px 3px 9px 3px}
.brand small{display:block;font-size:8px;letter-spacing:1.1px;color:var(--muted);font-weight:600}
.workspace{display:flex;align-items:center;gap:8px;background:#f7f9fa;border:1px solid var(--line);border-radius:6px;padding:9px 8px;margin:24px 0 20px;font-size:12px;font-weight:600}
.workspace small{display:block;color:var(--muted);font-size:10px;font-weight:400}
.workspace-icon{width:26px;height:26px;flex:none;display:grid;place-items:center;background:#e8edf0;border-radius:5px;font-weight:400}
.nav-label{font-size:11px;color:var(--muted);padding:0 10px 6px}
nav a{display:flex;align-items:center;gap:9px;min-height:42px;padding:8px 10px;margin:3px 0;border-radius:6px;color:#465665;font-size:13px;text-decoration:none}
nav a:hover{background:#f5f7f9;text-decoration:none}
nav a.active{color:var(--primary);background:var(--selected);font-weight:600}
nav a.sub{padding-left:32px;font-size:12px;min-height:34px}
.nav-icon{font-size:16px;width:18px;text-align:center;flex:none}
.nav-count{margin-left:auto;font-size:11px;background:#e0ebe8;color:#1d5d57;border-radius:9px;padding:0 7px;font-weight:600}
nav a.active .nav-count{background:#cfe4df}
.sidebar-note{margin:auto 8px 0;border-top:1px solid var(--line);padding-top:14px;font-size:10px;color:var(--muted);line-height:1.7}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--primary);margin-right:5px}
.shell{margin-left:220px;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:60px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:15}
.crumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
.crumb i{color:#a5b0ba;font-style:normal}
.crumb b{color:var(--ink);font-weight:600}
.session{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
.chip-live{display:inline-flex;align-items:center;gap:6px;background:var(--success-bg);color:var(--success);border-radius:12px;padding:2px 10px;font-size:11px}
.demobar{padding:7px 28px;background:#edf3f5;border-bottom:1px solid #dce6eb;color:#476173;font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.demobar b{color:#2c4a5c}
main{padding:24px 28px 36px;max-width:1680px;width:100%;flex:1}
footer{padding:0 28px 18px;font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}
/* ---------- primitives ---------- */
.button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:6px 13px;background:#fff;border:1px solid var(--control);border-radius:6px;font-size:12px;color:var(--ink);white-space:nowrap;text-decoration:none}
.button:hover{background:#f5f8f9;text-decoration:none}
.button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.button.primary:hover{background:var(--primary-hover)}
.button.primary:active{background:var(--primary-active)}
.button.small{min-height:28px;font-size:11px;padding:3px 9px}
.button.link{border-color:transparent;background:none;color:var(--primary);padding:2px 0;min-height:24px}
.button.danger{color:var(--danger);border-color:#c67875}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px}
.eyebrow{font-size:10px;letter-spacing:1.4px;color:var(--primary);font-weight:600;margin-bottom:4px}
.subtitle{color:var(--muted);font-size:12px;margin-top:5px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel+.panel{margin-top:16px}
.panel-head{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel-head small{font-size:11px;color:var(--muted);font-weight:400}
.panel-body{padding:18px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:1.5;padding:2px 7px;border-radius:4px;font-weight:500;background:#eef1f4;color:#556575;white-space:nowrap}
.badge.success{color:var(--success);background:var(--success-bg)}
.badge.warning{color:var(--warning);background:var(--warning-bg)}
.badge.danger{color:var(--danger);background:var(--danger-bg)}
.badge.info{color:var(--info);background:var(--info-bg)}
.badge.plain{background:#f4f6f8;color:var(--muted);border:1px solid var(--line)}
.note{border:1px solid #d7e5ee;border-left:3px solid var(--info);background:var(--info-bg);padding:11px 14px;border-radius:5px;font-size:12px;color:#2c4a63}
.note.warn{border-color:#e9d3aa;border-left-color:var(--warning);background:#fff8ed;color:#794c12}
.note.bad{border-color:#eac6c3;border-left-color:var(--danger);background:var(--danger-bg);color:#923632}
.note.ok{border-color:#c7ddcf;border-left-color:var(--success);background:var(--success-bg);color:var(--success)}
.note strong{display:block;font-size:12px;margin-bottom:2px}
.note p{font-size:11px;line-height:1.75}
.note .row{margin-top:8px}
.micro{font-size:11px;color:var(--muted);line-height:1.75}
.table-wrap{overflow:auto;max-width:100%}
.list-table{min-width:760px}
/* 只对数字、日期、状态与操作列禁止换行；店铺/商品列允许折行，避免窄窗下横向裁切 */
.list-table th,.list-table td:nth-child(4),.list-table td:nth-child(5),
.list-table td:nth-child(6),.list-table td:nth-child(7),.list-table td:nth-child(8){white-space:nowrap}
.scroll-hint{display:none}
@media (max-width:1000px){.scroll-hint{display:inline}}
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;font-size:11px;font-weight:500;color:var(--muted);background:#f8fafb;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #edf0f3;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8fbfa}
td.r,th.r{text-align:right}
.prod{font-weight:600;font-size:12.5px;line-height:1.4}
.prod-sub{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:1px}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:12px}
.empty h3{color:var(--ink);margin-bottom:6px;font-size:14px}
.field{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--control);border-radius:5px;padding:6px 9px;font-size:12px;color:var(--ink);background:#fff;min-height:32px}
.field textarea{min-height:62px;resize:vertical;width:100%}
.filters{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.filters .field{flex:0 1 auto}
.filters input[type=search]{min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:none;font-size:12px;padding:7px 12px;color:var(--muted);min-height:34px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--selected);color:var(--primary);font-weight:600}
.seg em{font-style:normal;font-size:10px;margin-left:4px;color:var(--subtle)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto;margin:0 -18px;padding:0 18px}
.tabs button{border:0;border-bottom:2px solid transparent;background:none;font-size:12.5px;color:var(--muted);min-height:42px;padding:6px 0;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.kv{margin:0;font-size:12px}
.kv dt{color:var(--muted);font-size:11px;margin-top:10px}
.kv dd{margin:2px 0 0}
.kv.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.details summary{cursor:pointer;font-size:11px;color:var(--primary);padding:4px 0}
pre{background:var(--canvas);border:1px solid var(--line);border-radius:5px;padding:12px;font-size:11px;overflow:auto;max-height:320px;white-space:pre-wrap;word-break:break-word;margin:8px 0 0}
/* ---------- workbench ---------- */
.gate{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:6px;padding:11px 16px;margin-bottom:16px;font-size:12px;flex-wrap:wrap}
.gate.warn{border-left-color:var(--warning)}
.gate .gate-main{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.gate .spacer{flex:1}
.todo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.todo-card{text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;gap:2px;color:var(--ink)}
.todo-card:hover{border-color:#8fb6b0;background:#fcfefd}
.todo-card .n{font-size:26px;font-weight:600;line-height:1.35;letter-spacing:-.5px}
.todo-card .l{font-size:12px;font-weight:600}
.todo-card .h{font-size:11px;color:var(--muted);line-height:1.6}
.todo-card.zero .n{color:var(--subtle)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.queue{display:grid}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 132px 108px auto;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid #edf0f3}
.qrow:last-child{border-bottom:0}
.qrow:hover{background:#f8fbfa}
.qnum{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);text-align:right}
.qnum b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.qnum .micro{display:block;line-height:1.5}
.timeline{display:grid;gap:0}
.tl{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:8px 0;font-size:11.5px;border-bottom:1px dashed #edf0f3}
.tl:last-child{border-bottom:0}
.tl time{color:var(--muted);font-variant-numeric:tabular-nums}
.tl p{line-height:1.6}
/* ---------- detail ---------- */
.back{font-size:12px;display:inline-flex;align-items:center;gap:6px;margin-bottom:12px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:18px;align-items:start}
.sku-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:14px}
.sku-head h1{font-size:22px}
.sku-meta{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.verdict{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden}
.verdict>div{padding:13px 16px;border-right:1px solid var(--line)}
.verdict>div:last-child{border-right:0}
.verdict small{display:block;font-size:11px;color:var(--muted)}
.verdict b{font-size:21px;font-weight:600;line-height:1.45;font-variant-numeric:tabular-nums}
.verdict b span{font-size:11px;font-weight:400;color:var(--muted);margin-left:3px}
.verdict .accent b{color:var(--primary)}
.rail{position:sticky;top:76px;display:grid;gap:14px}
.rail .panel-head{padding:12px 16px}
.rail .panel-body{padding:16px}
.rail-num{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:var(--canvas);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:12px}
.rail-num b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stepper{display:flex;gap:6px}
.stepper input{flex:1;min-width:0;border:1px solid var(--control);border-radius:5px;padding:7px 9px;font-size:14px;font-variant-numeric:tabular-nums;text-align:center}
.stepper button{width:34px;min-height:36px;border:1px solid var(--control);background:#fff;border-radius:5px;color:var(--ink);font-size:15px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:11px;line-height:1.6;margin:10px 0;color:#46525d}
.check input{margin-top:3px;accent-color:var(--primary);flex:none}
.hint{font-size:11px;line-height:1.7;color:var(--warning);background:var(--warning-bg);border-radius:4px;padding:6px 8px;margin-top:6px}
.hint.bad{color:var(--danger);background:var(--danger-bg)}
.quality{display:grid;gap:0}
.qitem{padding:11px 0;border-bottom:1px solid #edf0f3;font-size:12px}
.qitem:last-child{border-bottom:0}
.qitem .qt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:12px}
.qitem p{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:3px}
.qitem .own{font-size:11px;color:#46525d;margin-top:3px}
.facts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.facts3>div{border:1px solid var(--line);border-radius:6px;padding:9px 12px;background:#fcfdfd;min-width:0}
.facts3 small{display:block;font-size:10.5px;color:var(--muted)}
.facts3 b{display:block;font-size:13px;font-weight:600;margin-top:1px;line-height:1.5}
.facts3 span{display:block;font-size:10.5px;color:var(--muted);line-height:1.6;overflow-wrap:anywhere}
.bar{height:6px;background:#eef2f4;border-radius:3px;overflow:hidden;min-width:60px}.bar span{display:block;height:100%;background:var(--primary)}
.bar.neg span{background:#c9a08d}
/* ---------- requisition ---------- */
.req-state{font-size:11px;color:var(--muted)}
.steps{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;background:#fff;overflow:auto;margin-bottom:18px}
.step{flex:1;min-width:150px;padding:11px 14px;font-size:11.5px;color:var(--muted);border-right:1px solid var(--line)}
.step:last-child{border-right:0}
.step b{display:block;font-size:12px;color:var(--ink);font-weight:600;margin-bottom:1px}
.step.done{background:#f4faf7;color:var(--success)}
.step.done b{color:var(--success)}
.step.now{background:var(--selected);color:var(--primary)}
.step.now b{color:var(--primary)}
.step.todo{opacity:.65}
/* ---------- dialog / toast ---------- */
dialog{border:0;padding:0;border-radius:10px;width:min(620px,calc(100vw - 32px));max-height:84vh;color:var(--ink);box-shadow:0 18px 50px #172c3c30}
dialog::backdrop{background:#142a3b66}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:16px}
.dlg-body{padding:18px 20px;font-size:12px;line-height:1.8}
.dlg-body p{margin-bottom:10px}
.dlg-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.close{border:0;background:none;font-size:20px;color:var(--muted);padding:0 4px;line-height:1}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--nav);color:#fff;padding:11px 18px;border-radius:6px;font-size:12px;z-index:50;max-width:calc(100vw - 32px);box-shadow:0 10px 30px #172c3c33}
/* ---------- responsive ---------- */
@media (max-width:1240px){
  .detail{grid-template-columns:1fr}
  .rail{position:static;grid-template-columns:1fr 1fr;align-items:start}
  .todo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:1fr}
  .qrow{grid-template-columns:minmax(0,1fr) 120px auto}
  .qrow .qhide{display:none}
}
@media (max-width:980px){
  .sidebar{position:static;width:auto;flex-direction:row;align-items:center;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line);gap:6px;overflow-x:auto}
  .brand{font-size:18px;padding:0;flex:none}
  .brand-symbol{width:28px;height:31px;font-size:16px}
  .workspace,.nav-label,.sidebar-note{display:none}
  nav{display:flex;gap:2px;flex:none}
  nav a{min-height:36px;padding:6px 10px;font-size:12px;margin:0}
  nav a.sub{display:none}
  .nav-icon{display:none}
  .shell{margin-left:0}
  .topbar{position:static;height:54px;padding:0 16px}
  .demobar{padding:6px 16px}
  main{padding:18px 16px 28px}
  footer{padding:0 16px 14px}
  .rail{grid-template-columns:1fr}
  .verdict{grid-template-columns:repeat(2,minmax(0,1fr))}
  .verdict>div:nth-child(2){border-right:0}
  .verdict>div:nth-child(1),.verdict>div:nth-child(2){border-bottom:1px solid var(--line)}
  .sku-head{flex-direction:column;gap:10px}
}
@media (max-width:620px){
  .page-head{flex-direction:column;align-items:flex-start}
  .todo-grid{grid-template-columns:1fr}
  .qrow{grid-template-columns:1fr auto;gap:8px}
  .qrow .qmid{display:none}
  .filters{width:100%}
  .filters .field{flex:1 1 100%}
  .filters input[type=search]{min-width:0;width:100%}
  .kv.grid2{grid-template-columns:1fr}
  .facts3{grid-template-columns:1fr}
  .verdict b{font-size:18px}
  .step{min-width:130px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">跳至主要内容</a>
<aside class="sidebar" id="sidebar"></aside>
<div class="shell">
  <header class="topbar">
    <div class="crumb" id="crumb"></div>
    <div class="session"><span class="chip-live"><span class="dot"></span>演示会话</span><span>采购运营 · 林予</span></div>
  </header>
  <div class="demobar">
    <span><b>UX v3 交互原型</b> · 全部为脱敏模拟数据，未连接 ERP、未调用模型、未读取本机密钥</span>
    <span id="demobar-right"></span>
  </div>
  <main id="main" tabindex="-1"></main>
  <footer><span>序衡 / S01 采购补货分析 · 原型不代表真实业务结果</span><span>人工确认 ≠ ERP 领导审批</span></footer>
</div>
<dialog id="dialog"><div id="dialog-inner"></div></dialog>
<div id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';

/* =====================================================================
   1. 演示数据（脱敏模拟，全部为构造值）
   ===================================================================== */
const POLICY = {
  id:'s01-admission', version:'v0-draft', status:'DRAFT',

function stage(sku){
  const r = sku.requisition;
  if (r) {
    if (r.state==='UNKNOWN') return 'requisition_check';
    if (r.state==='APPROVED') return 'requisition_approved';
    return 'requisition_waiting';
  }
  if (sku.quality.some(c=>c.code==='ANALYSIS_FAILED')) return 'failed';
  if (sku.source==='NONE') return 'need_evidence';
  if (sku.source==='ERP_REF') return 'need_evidence';
  if (!sku.plan.suggest) return 'no_need';
  return 'pending_confirm';
}

const esc = v => String(v===null||v===undefined?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => v===null||v===undefined ? '—' : String(v);
const badge = (t,tone)=>`<span class="badge ${tone||''}">${esc(t)}</span>`;
const stageBadge = sku => badge(STAGE_LABEL[stage(sku)], STAGE_TONE[stage(sku)]);
const byKey = k => SKUS.find(s=>s.key===k);
const blocking = sku => sku.quality.filter(c=>c.level==='BLOCK');
const groupOf = sku => STAGE_GROUP[stage(sku)];

function money(v,c){ return v===null||v===undefined ? '未知' : `${v} ${c||''}`.trim(); }

function parseHash(){
  const parts = location.hash.replace(/^#\/?/,'').split('/');
  const page = parts[0]||'workbench';
  return {page:page, id: decodeURIComponent(parts[1]||'')||null, tab: parts[2]||null};
}
function go(path){
  if (location.hash === '#'+path) render();
  else location.hash = path;
}
function navigatePath(){
  const r = parseHash();
  if (r.page==='sku' && !byKey(r.id)) { location.replace('#/suggestions'); return; }
  state.route = r;
  if (r.page==='sku'){
    state.lastSku = r.id;
    state.tab = ['overview','sales','procurement','quality','history'].includes(r.tab) ? r.tab : 'overview';
    sessionStorage.setItem('ux3.lastSku',r.id);
  }
  render();
  window.scrollTo(0,0);
  document.getElementById('main').focus({preventScroll:true});
}

function counts(){
  const c = {pending_confirm:0,need_evidence:0,no_need:0,requisition:0,failed:0};
  SKUS.forEach(s=>{
    const st = stage(s);
    if (st==='pending_confirm') c.pending_confirm++;
    else if (st==='need_evidence') c.need_evidence++;
    else if (st==='no_need') c.no_need++;
    else if (st==='failed') c.failed++;
    else c.requisition++;
  });
  c.active = c.pending_confirm + c.need_evidence;
  c.reqAttention = SKUS.filter(s=>s.requisition && s.requisition.state!=='APPROVED').length;
  return c;
}

function matchFilters(s){
  const f = state.filters, t = f.q.trim().toLowerCase();
  if (t && !(s.sku.toLowerCase().includes(t) || s.name.toLowerCase().includes(t))) return false;
  if (f.store && s.store!==f.store) return false;
  if (f.warehouse && s.warehouse!==f.warehouse) return false;
  if (f.source && s.source!==f.source) return false;
  if (f.stage && groupOf(s)!==f.stage) return false;
  return true;
}

        <span class="prod-sub"><span class="mono">${esc(s.sku)}</span>${s.ai.status==='AVAILABLE'?' · <span class="badge info" style="font-size:10px">AI 已解读</span>':''}</span></td>
    <td>${esc(s.store)}<span class="prod-sub">${esc(s.warehouse)}</span></td>

function refreshRows(){
  const rows = SKUS.filter(matchFilters);

  if (!rows.length){
    tableWrap.hidden = true; empty.hidden = false;
    empty.innerHTML = `<div class="empty"><h3>没有符合条件的建议</h3><p>当前筛选条件与 ${SKUS.length} 个店仓对象均不匹配。</p><button class="button" data-act="clear">清空筛选</button></div>`;
  } else { tableWrap.hidden = false; empty.hidden = true; }
  const cnt = document.getElementById('res-count');
  if (cnt) cnt.textContent = `共 ${rows.length} 项${rows.length!==SKUS.length?`（全部 ${SKUS.length} 项）`:' · 全部'}`;
  const info = document.getElementById('page-info');
  if (info) info.textContent = `显示 ${rows.length} 项 · 全部筛选结果在同一页`;

  if (sku) sidebar();

function verdictStrip(s){
  const st = stage(s);
  const cells = [];
  if (st==='no_need'){
    cells.push(['规则结论','无需补货','可覆盖至 11-23'],['当前可用',s.plan.available,'件'],['日均需求',s.plan.avgDaily,'件 / 天'],['下次复核','自动','每日检查']);
  } else if (s.plan.suggest===null){
    cells.push(['建议数量','—','数据不足，未形成'],['当前可用',num(s.plan.available),'件'],['缺失项',blocking(s).length,'项阻断'],['责任方',blocking(s)[0]?blocking(s)[0].owner:'—','']);
  } else {
    cells.push(['建议数量',s.plan.suggest,s.unit],['当前可用',num(s.plan.available),s.unit],
      ['目标库存',num(s.plan.target),s.unit],['首次短缺',s.plan.firstShortage||'—','']);
  }
  return `<div class="verdict">${cells.map((c,i)=>`<div class="${i===0?'accent':''}"><small>${esc(c[0])}</small><b>${esc(c[1])}${c[2]?`<span>${esc(c[2])}</span>`:''}</b></div>`).join('')}</div>`;
}

function tabBody(s,tab){
  if (tab==='sales') return salesTab(s);
  if (tab==='procurement') return procurementTab(s);
  if (tab==='quality') return qualityTab(s);
  if (tab==='history') return historyTab(s);
  return overviewTab(s);
}

function overviewTab(s){
  const st = stage(s);
  const blocks = blocking(s);
  const hints = [];
  if (st==='pending_confirm') hints.push(`规则建议 ${s.plan.suggest} ${s.unit} 满足最小起订量 ${s.constraints.moq} 与整箱倍数 ${s.constraints.multiple}；确认后进入请购。`);
  if (st==='need_evidence') hints.push(blocks.length?blocks[0].title+'：'+blocks[0].detail: '来源依据不足，暂不形成补货数量。');
  if (st==='no_need') hints.push('规则判断当前可用库存足以覆盖需求窗口，未生成采购建议。');
  if (st==='requisition_waiting'||st==='requisition_approved'||st==='requisition_check') hints.push('该 SKU 已有人工确认的请购记录，数量调整需在请购管理中核对。');

  const purch = s.purchases.length
    ? `<div class="note ok" style="margin-top:14px"><strong>已有正式采购在途</strong><p>${s.purchases.map(p=>`${esc(p.no)}：未收 ${p.unreceived} 件，预计 ${esc(p.eta)} 到货`).join('；')}。平台未把未承诺到货日当作可售供给。</p></div>`
    : '';

  return `
    <div class="note ${st==='need_evidence'?'warn':'ok'}"><strong>${st==='need_evidence'?'未形成补货结论':'判定结论'}</strong>
      <p>${esc(hints.join(' '))}</p></div>
    <h3 style="margin:16px 0 6px">为什么是这个数字</h3>
    <p class="micro">${s.plan.suggest===null?'缺少可用销量窗口，未计算日均需求与目标库存，因此不给出建议数量。':
      `最近 ${s.plan.salesDays} 个完整业务日销量 ${s.plan.totalSales} 件，日均 ${s.plan.avgDaily} 件；按覆盖天数与目标库存 ${s.plan.target} 件计算缺口 ${s.plan.gap} 件，取满足最小起订量 ${s.constraints.moq} 与整箱倍数 ${s.constraints.multiple} 的最小可行量 ${s.plan.suggest} 件。`}</p>
    <p class="micro" style="margin-top:8px">上述为平台规则结果，数量由人工最终确认；确认不等于 ERP 审批。</p>
    <div class="facts3">
      <div><small>销量窗口</small><b>${s.plan.salesDays?s.plan.salesDays+' 个业务日':'未取得'}</b><span>${esc(s.plan.window)}${s.plan.avgDaily?` · 日均 ${s.plan.avgDaily} 件`:''}</span></div>
      <div><small>采购条件</small><b>${s.constraints.moq?`MOQ ${s.constraints.moq} / 倍数 ${s.constraints.multiple}`:'未取得'}</b><span>${esc(s.constraints.supplier||'供应商未确认')}${s.constraints.quoteValid?` · 报价至 ${esc(s.constraints.quoteValid.split('—')[1]||'')}`:''}</span></div>
      <div><small>已有正式采购</small><b>${s.purchases.length?s.purchases.length+' 张单据':'无'}</b><span>${s.purchases.length?'在途 '+s.purchases.reduce((a,p)=>a+p.unreceived,0)+' 件':'本次未取得该店仓采购单'}</span></div>
    </div>
    ${purch}
    ${s.quality.length?`<div class="note warn" style="margin-top:12px"><strong>${s.quality.length} 项限制需要知悉</strong><p>${esc(s.quality.slice(0,2).map(c=>c.title).join('；'))}${s.quality.length>2?` 等 ${s.quality.length} 项`:''}。可展开「依据与限制」查看责任方与下一步。</p></div>`:''}
    ${draftNote(s)}
    <p class="micro" style="margin-top:12px">数据时点 ${BATCH.at} · 结论按本次快照保留，重新分析会生成新版本。</p>`;
}

/* 政策草案只在有对应检查项时出现，明确标注未生效，不与已实施规则混排 */
function draftNote(s){
  const d = s.quality.find(c=>c.draft);
  if (!d) return '';
  return `<p class="micro" style="margin-top:10px"><span class="badge plain">政策草案 · 未生效</span> ${esc(d.draft)}，仅作提示，未参与本次判定。</p>`;
}

function salesTab(s){
  if (!s.daily.length) return `<div class="empty" style="padding:28px 8px"><h3>没有可展示的逐日数据</h3><p>${blocking(s).length?esc(blocking(s)[0].detail):'本次分析未取得库存与销量时间序列。'}</p></div>`;
  const rows = s.daily.map(d=>{
    const bad = d.close<0, w = Math.min(100,Math.abs(d.close)/60*100);
    return `<tr><td class="num">${d.day}</td><td class="r num">${d.demand}</td><td class="r num">${d.arrive||'—'}</td>
      <td style="width:120px"><div class="bar ${d.close<0?'neg':''}"><span style="width:${Math.max(4,w)}%"></span></div></td>
      <td class="r num" style="color:${bad?'var(--danger)':'inherit'}">${d.close}</td>
      <td>${d.close<0?badge('预计短缺','warning'):badge(d.src,'plain')}</td></tr>`;
  }).join('');
  return `
    <h3>有效销量窗口</h3>
    <p class="micro">统计区间 ${esc(s.plan.window)} · 计入 ${s.plan.salesDays||0} 个完整业务日${s.plan.salesDays&&s.plan.salesDays<7?'（少于草案要求，草案未生效）':''}</p>
    <div class="table-wrap" style="margin-top:12px">
      <table><caption class="sr-only">逐日库存预测</caption>
        <thead><tr><th>业务日</th><th class="r">需求量</th><th class="r">到货</th><th>结存趋势</th><th class="r">预计结存</th><th>说明</th></tr></thead>
        <tbody>${rows}</tbody></table>
    </div>
    <p class="micro" style="margin-top:10px">到货只计入已确认的采购计划；未承诺到货日不抵扣。结存为平台规则推算，不是 ERP 实际库存。</p>`;
}

function procurementTab(s){
  const c = s.constraints;
  const po = s.purchases.length ? `<div class="table-wrap" style="margin-top:14px"><table>
      <thead><tr><th>正式单据</th><th>状态</th><th class="r">采购 / 已收 / 待收</th><th>预计到货</th></tr></thead>
      <tbody>${s.purchases.map(p=>`<tr><td class="mono">${esc(p.no)}</td><td>${esc(p.status)}<span class="prod-sub">${esc(p.note||'')}</span></td>
        <td class="r num">${p.ordered} / ${p.received} / ${p.unreceived}</td><td class="num">${esc(p.eta)}</td></tr>`).join('')}</tbody></table></div>`
    : '<p class="micro" style="margin-top:10px">本次未取得正式采购单据。查询范围与完整性限制见「依据与限制」。</p>';
  return `<dl class="kv grid2">
      <div><dt>最小起订量（MOQ）</dt><dd class="num">${num(c.moq)} ${esc(s.unit)}</dd></div>
      <div><dt>整箱倍数</dt><dd class="num">${num(c.multiple)} ${esc(s.unit)}</dd></div>
      <div><dt>报价单价</dt><dd class="num">${money(c.price,c.currency)}</dd></div>
      <div><dt>报价有效期</dt><dd>${esc(c.quoteValid||'未知')}</dd></div>
      <div><dt>供应商</dt><dd>${esc(c.supplier||'未确认')}</dd></div>
      <div><dt>报价号</dt><dd class="mono">${esc(c.quote||'未确认')}</dd></div>
      <div><dt>最低采购金额</dt><dd class="num">${money(c.minAmount,c.currency)}</dd></div>
      <div><dt>参考交期</dt><dd class="num">${c.leadDays?c.leadDays+' 天':'未知'}</dd></div>
    </dl>
    <h3 style="margin-top:18px">已有正式采购</h3>${po}`;
}

function qualityTab(s){
  const items = s.quality.length ? s.quality.map(c=>`
    <div class="qitem">
      <div class="qt">${badge(c.level==='BLOCK'?'阻断':'提示', c.level==='BLOCK'?'danger':'warning')}${esc(c.title)}</div>
      <p>${esc(c.detail)}</p>
      ${c.draft?`<p><span class="badge plain">政策草案 · 未生效</span> ${esc(c.draft)}</p>`:''}
      <p class="own">责任方：${esc(c.owner)} · 下一步：${esc(c.action)}${c.affects?` · 影响：${esc(c.affects.join('、'))}`:''}</p>
    </div>`).join('')
    : '<div class="empty" style="padding:24px 8px"><h3>本次没有未解决的数据或规则限制</h3><p>仍不代表企业正式业务准入已通过。</p></div>';
  return `<h3>数据准入状态</h3>
    <p class="micro">政策版本 ${esc(POLICY.version)} · ${badge('草案 · 未生效','warning')} · ${esc(POLICY.note)}</p>
    <div class="quality" style="margin-top:12px">${items}</div>
    <h3 style="margin-top:18px">数据来源与证据定位</h3>
    <p class="micro">每项事实可单独核对；不提供 ERP 原始响应，只展示本次判定实际使用的字段值。</p>
    <div class="table-wrap" style="margin-top:10px"><table>
      <caption class="sr-only">本次判定使用的数据来源</caption>
      <thead><tr><th>事实</th><th>读取状态</th><th>时点</th><th>范围</th><th></th></tr></thead>
      <tbody>${sourceRows(s)}</tbody></table></div>
    <details class="details" style="margin-top:16px"><summary>技术信息与快照引用</summary>
      <pre>任务：task-s01-v2-demo-0007（演示）
快照：snapshot-2026-11-14-0802-${esc(s.sku.toLowerCase())}
来源租户：teaching-tenant-demo
统计口径：v2-counts-v2
说明：原型不展示真实任务号与快照标识，正式页面在「技术信息」折叠区提供可追溯引用。</pre>
    </details>`;
}

function sourceRows(s){
  const rows = [
    ['可用库存', s.plan.available===null?'未取得':'已读取', s.plan.available===null?'warning':'success', '08:01', `${esc(s.warehouse)} · 唯一仓库记录`, 'inv'],
    ['已核对销量', s.plan.salesDays?'已读取':'不足', s.plan.salesDays?'success':'danger', '08:02', `${esc(s.plan.window)} · ${s.plan.salesDays||0} 个业务日`, 'sales'],
    ['正式采购', s.purchases.length?'已查询 · 有单据':'已查询 · 无记录', 'plain', '08:02', `租户 / SKU / 仓库`, 'po'],
    ['供应商报价', s.constraints.quote?'已读取 · 有效':'未取得', s.constraints.quote?'success':'warning', '07:58', `${esc(s.constraints.supplier||'—')}`, 'quote']
  ];
  return rows.map(r=>`<tr><td>${r[0]}</td><td>${badge(r[1],r[2])}</td><td class="num">${r[3]}</td>
    <td class="micro" style="color:var(--muted)">${r[4]}</td>
    <td class="r"><button class="button small" data-act="evidence" data-kind="${r[5]}">查看依据</button></td></tr>`).join('');
}

function historyTab(s){
  return `<div class="table-wrap"><table><caption class="sr-only">该 SKU 的历史分析</caption>
    <thead><tr><th>分析时间</th><th>建议来源</th><th class="r">建议数量</th><th>结果</th><th></th></tr></thead>
    <tbody>${s.history.map(h=>`<tr><td class="num">${esc(h.at)}</td><td>${esc(h.source)}</td>
      <td class="r num">${h.qty===null?'—':h.qty+' '+esc(s.unit)}</td><td>${esc(h.result)}</td>
      <td class="r"><button class="button small" data-act="history-detail" data-at="${esc(h.at)}">查看</button></td></tr>`).join('')}</tbody></table></div>
    <p class="micro" style="margin-top:10px">历史分析按当时快照保留，不复用旧结论；重新分析会生成新版本。</p>`;
}

function rail(s){
  const st = stage(s);
  const qty = state.qty[s.key];
  const sug = s.plan.suggest;

  if (st==='no_need')
    return `<section class="panel"><div class="panel-head"><h2>不需要请购</h2></div><div class="panel-body">
      <p class="micro">规则判断当前库存可覆盖需求窗口，平台不生成采购建议，也不允许在此提交请购。</p>
      <div class="note ok" style="margin-top:12px"><strong>下次自动复核</strong><p>每日检查时会重新计算；如需立即复核可点「重新分析此 SKU」。</p></div></div></section>`;

  if (st==='need_evidence')
    return `<section class="panel"><div class="panel-head"><h2>暂不可提交请购</h2></div><div class="panel-body">
      <p class="micro">存在 ${blocking(s).length} 项阻断，补货数量尚未形成。请先按责任方补证后重新分析。</p>
      <div class="note warn" style="margin-top:12px"><strong>${esc(blocking(s)[0]?blocking(s)[0].title:'依据不足')}</strong><p>${esc(blocking(s)[0]?blocking(s)[0].action:'补充依据后重新分析')}</p></div>
      <button class="button" style="width:100%;margin-top:12px" data-act="rerun-single">重新分析此 SKU</button></div></section>`;

  if (st==='failed')
    return `<section class="panel"><div class="panel-head"><h2>本次分析失败</h2></div><div class="panel-body">
      <p class="micro">读取中断，未产生任何结论。可安全重试；不会重复创建采购或调用模型。</p>
      <button class="button primary" style="width:100%;margin-top:12px" data-act="rerun-single">重新分析此 SKU</button></div></section>`;

  if (st.startsWith('requisition')){
    const r = s.requisition;
    const tone = r.state==='APPROVED'?'ok':r.state==='UNKNOWN'?'bad':'';
    const title = r.state==='APPROVED'?'ERP 已审批':r.state==='UNKNOWN'?'提交结果待核对':'已提交 · 待 ERP 审批';
    return `<section class="panel"><div class="panel-head"><h2>请购状态</h2><small>${esc(r.no)}</small></div><div class="panel-body">
      <div class="note ${tone}"><strong>${title}</strong>
        <p>人工最终 ${r.finalQty} ${esc(s.unit)} / 平台建议 ${r.suggestQty} ${esc(s.unit)}${r.reason?' · 原因：'+esc(r.reason):''}</p></div>
      <dl class="kv"><dt>ERP 单据号 / 状态</dt><dd class="mono">${esc(r.no)} · ${esc(r.erpStatus)}</dd>
        <dt>最近独立回读</dt><dd>${esc(r.verifiedAt)}</dd></dl>
      ${r.state==='UNKNOWN'?`<button class="button" style="width:100%;margin-top:12px" data-act="req-check">使用原单核对</button>`:''}
      <a class="button" style="width:100%;margin-top:10px;justify-content:center" href="#/requisitions/${encodeURIComponent(r.no)}">查看请购单</a>
      <p class="micro" style="margin-top:10px">本平台只创建并提交请购，ERP 领导审批、下单与收货在 ERP 中完成。</p>
    </div></section>`;
  }

  // pending_confirm
  const valid = validate(s, qty);
  return `<section class="panel"><div class="panel-head"><h2>人工确认</h2><small>确认数量，提交 ERP 请购</small></div>
    <div class="panel-body">
      <div class="rail-num"><span class="micro">平台建议数量</span><span><b>${sug}</b> <span class="micro">${esc(s.unit)}</span></span></div>
      <label class="field">人工最终数量
        <div class="stepper">
          <button type="button" data-act="qty-step" data-step="-${s.constraints.multiple}">−</button>
          <input id="qty-input" type="number" min="1" step="${s.constraints.multiple}" value="${qty}" inputmode="numeric">
          <button type="button" data-act="qty-step" data-step="${s.constraints.multiple}">+</button>
        </div>
      </label>
      <p class="micro" style="margin-top:6px">MOQ ${s.constraints.moq} · 整箱倍数 ${s.constraints.multiple}</p>
      <div id="rail-check">${railCheck(s,qty)}</div>
      <div id="reason-wrap" ${String(qty)===String(sug)?'hidden':''} style="margin-top:8px">
        <label class="field">减少或增加数量的原因（必填）<textarea id="reason-input" maxlength="200" placeholder="例如：考虑已有在途 36 件，本次只补一半">${esc(state.reason[s.key]||'')}</textarea></label>
      </div>
      <label class="check"><input type="checkbox" id="ack" ${state.ack[s.key]?'checked':''}>
        <span>我已知悉该建议的来源与未验证事项，确认数量用于销售备货。</span></label>
      <button class="button primary" id="submit-btn" style="width:100%;margin-top:6px" data-act="confirm" ${valid||!state.ack[s.key]?'disabled':''}>确认并提交 ERP 请购</button>
      <p class="micro" style="margin-top:10px">提交后进入 ERP 审批，本平台不代替领导审批，也不会自动下单。</p>
    </div></section>`;
}

function validate(s,qty){
  const c = s.constraints;
  if (!qty || !Number.isInteger(Number(qty))) return '请填写整数数量';
  if (Number(qty) < c.moq) return `少于最小起订量 ${c.moq} ${s.unit}`;
  if (Number(qty) % c.multiple) return `必须是整箱倍数 ${c.multiple} 的整数倍`;
  if (Number(qty) !== s.plan.suggest && !(state.reason[s.key]||'').trim()) return '调整了建议数量，请填写原因';
  return '';
}
function railCheck(s,qty){
  const err = validate(s,qty);
  if (!err) return `<p class="micro" style="color:var(--success);margin-top:6px">数量符合约束${Number(qty)!==s.plan.suggest?'，已记录调整原因':''}。</p>`;
  return `<p class="hint">${esc(err)}</p>`;
}

function aiCard(s){
  const a = s.ai;
  if (a.status==='AVAILABLE'){
    const secs = Object.entries(a.sections).map(([k,v])=>`<div style="margin-top:10px"><h3>${esc(k)}</h3>
      <ul style="margin:4px 0 0;padding-left:18px;font-size:12px;line-height:1.75">${v.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`).join('');
    return `<section class="panel"><div class="panel-head"><h2>AI 解读</h2>${badge('已生成','info')}</div><div class="panel-body">
      ${secs}<p class="micro" style="margin-top:12px">模型仅解释已有事实，不计算库存与金额。Token ${a.usage.tokens} · ${esc(a.usage.cost)}。最终决定由人工做出。</p></div></section>`;
  }
  return `<section class="panel"><div class="panel-head"><h2>AI 解读</h2>${badge('未调用','plain')}</div><div class="panel-body">
    <p class="micro">本次查看未调用模型。需要时可对当前 SKU 单独发起一次解读，仅解释已有事实。</p>
    <button class="button small" style="width:100%;margin-top:10px" data-act="ai-run">按需生成解读</button></div></section>`;
}

/* =====================================================================
   8. 页面：请购管理
   ===================================================================== */
const REQS = () => SKUS.filter(s=>s.requisition).map(s=>Object.assign({skuRef:s}, s.requisition))
  .sort((a,b)=> a.submittedAt < b.submittedAt ? 1 : -1);

function reqTone(r){ return r.state==='APPROVED'?'success':r.state==='UNKNOWN'?'danger':'info'; }
function reqLabel(r){ return r.state==='APPROVED'?'ERP 已审批':r.state==='UNKNOWN'?'提交结果待核对':'待 ERP 审批'; }

function pRequisitions(){
  const all = REQS();
  const f = state.reqTab;
  const rows = all.filter(r=>{
    if (f==='waiting') return r.state==='SUBMITTED';
    if (f==='approved') return r.state==='APPROVED';
    if (f==='check') return r.state==='UNKNOWN';
    return true;
  });
  return `
  <div class="page-head">
    <div><div class="eyebrow">S01 / REQUISITION</div><h1>请购管理</h1>
      <p class="subtitle">查看本平台创建并提交的请购单，以及 ERP 侧的真实审批状态。</p></div>
    <div class="row"><button class="button small" data-act="req-refresh">刷新 ERP 状态</button></div>
  </div>
  <div class="note" style="margin-bottom:16px"><strong>平台人工确认 ≠ ERP 领导审批</strong>
    <p>这里列出的是运营人员确认数量后提交给 ERP 的采购申请。审批、下单、收货在 ERP 中由对应角色完成，本平台只做独立回读并如实显示状态。</p></div>
  ${all.filter(r=>r.state==='UNKNOWN').length?`<div class="note bad" style="margin-bottom:16px"><strong>${all.filter(r=>r.state==='UNKNOWN').length} 张请购提交结果待核对</strong>
    <p>提交请求返回结果不明确，ERP 侧可能已生成单据。请按原单号核对，不要重复提交。</p>
    <div class="row"><button class="button small" data-act="req-tab" data-val="check">只看待核对</button></div></div>`:''}
  <div class="row" style="margin-bottom:14px"><div class="seg" role="group" aria-label="请购状态筛选">
    ${['all','等待审批','已审批','待核对'].map(()=>'').join('')}
    <button data-act="req-tab" data-val="all" aria-pressed="${f==='all'}">全部<em>${all.length}</em></button>
    <button data-act="req-tab" data-val="waiting" aria-pressed="${f==='waiting'}">待 ERP 审批<em>${all.filter(r=>r.state==='SUBMITTED').length}</em></button>
    <button data-act="req-tab" data-val="approved" aria-pressed="${f==='approved'}">ERP 已审批<em>${all.filter(r=>r.state==='APPROVED').length}</em></button>
    <button data-act="req-tab" data-val="check" aria-pressed="${f==='check'}">待核对<em>${all.filter(r=>r.state==='UNKNOWN').length}</em></button>
  </div></div>
  <section class="panel">
    ${rows.length?`<div class="table-wrap"><table>
      <caption class="sr-only">请购单列表</caption>
      <thead><tr><th>ERP 单据号</th><th>商品 / SKU</th><th class="r">人工最终 / 平台建议</th><th>提交时间</th><th>确认人</th><th>ERP 状态</th><th></th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td class="mono">${esc(r.no)}<span class="prod-sub">最近回读 ${esc(r.verifiedAt)}</span></td>
        <td><span class="prod">${esc(r.skuRef.name)}</span><span class="prod-sub"><span class="mono">${esc(r.skuRef.sku)}</span> · ${esc(r.skuRef.warehouse)}</span></td>
        <td class="r num">${r.finalQty} / ${r.suggestQty} ${esc(r.skuRef.unit)}</td>
        <td class="num">${esc(r.submittedAt)}</td>
        <td>${esc(r.confirmBy)}</td>
        <td>${badge(reqLabel(r),reqTone(r))}</td>
        <td class="r"><a class="button small" href="#/requisitions/${encodeURIComponent(r.no)}">查看</a></td></tr>`).join('')}</tbody></table></div>`
      :`<div class="empty"><h3>该状态下没有请购单</h3><p>换个状态查看，或从补货建议中确认数量后提交。</p></div>`}
  </section>
  <p class="micro" style="margin-top:12px">列表仅包含本平台创建的请购；ERP 中由其他系统创建的单据不在范围内。</p>`;
}

function pRequisition(no){
  const r = REQS().find(x=>x.no===no);
  if (!r) return `<div class="empty"><h3>没有这张请购单</h3><p><a href="#/requisitions">返回请购管理</a></p></div>`;
  const stepState = r.state==='APPROVED' ? 3 : r.state==='UNKNOWN' ? 1 : 2;
  const steps = [
    ['平台人工确认','数量由运营人员确认',0],
    ['提交至 ERP','生成采购申请并提交审批',1],
    ['ERP 领导审批','由 ERP 侧角色决定，本平台只读回读',2],
    ['下单与收货','不在本平台范围',3]
  ];
  return `
  <a class="back" href="#/requisitions">← 返回请购管理</a>
  <div class="page-head"><div>
    <div class="eyebrow">REQUISITION / ${esc(r.no)}</div>
    <h1>${esc(r.skuRef.name)}</h1>
    <p class="subtitle"><span class="mono">${esc(r.skuRef.sku)}</span> · ${esc(r.skuRef.store)} / ${esc(r.skuRef.warehouse)} · 提交于 ${esc(r.submittedAt)}</p>
  </div><div class="row">${badge(reqLabel(r),reqTone(r))}</div></div>

  <div class="steps">${steps.map((s,i)=>{
    const cls = i<stepState?'done':i===stepState?'now':'todo';
    return `<div class="step ${cls}"><b>${s[0]}</b>${s[1]}</div>`;}).join('')}</div>

  ${r.state==='UNKNOWN'?`<div class="note bad" style="margin-bottom:16px"><strong>提交结果未确认</strong>
    <p>提交请求返回结果不明确，ERP 侧可能已生成单据。请使用原单号核对，不要新建第二张申请。核对次数 ${r.readbacks}。</p>
    <div class="row"><button class="button small" data-act="req-check">使用原单核对</button></div></div>`:''}

  <div class="split">
    <section class="panel"><div class="panel-head"><h2>数量与依据</h2></div><div class="panel-body">
      <div class="verdict" style="grid-template-columns:repeat(3,1fr)">
        <div><small>平台建议数量</small><b>${r.suggestQty}<span>${esc(r.skuRef.unit)}</span></b></div>
        <div class="accent"><small>人工最终数量</small><b>${r.finalQty}<span>${esc(r.skuRef.unit)}</span></b></div>
        <div><small>调整</small><b>${r.finalQty-r.suggestQty>=0?'+':''}${r.finalQty-r.suggestQty}<span>${esc(r.skuRef.unit)}</span></b></div>
      </div>
      <dl class="kv" style="margin-top:14px">
        <dt>调整原因</dt><dd>${r.reason?esc(r.reason):'原样确认，未调整'}</dd>
        <dt>确认人</dt><dd>${esc(r.confirmBy)}（采购运营）</dd>
        <dt>来源建议</dt><dd>${esc(SOURCES[r.skuRef.source])} · ${esc(r.skuRef.plan.firstShortage?'首次短缺 '+r.skuRef.plan.firstShortage:'—')}</dd>
      </dl>
      <a class="button small" style="margin-top:14px" href="#/sku/${encodeURIComponent(r.skuRef.key)}">回到 SKU 详情查看依据</a>
    </div></section>
    <div>
      <section class="panel"><div class="panel-head"><h2>ERP 单据</h2></div><div class="panel-body">
        <dl class="kv">
          <dt>单据号</dt><dd class="mono">${esc(r.no)}</dd>
          <dt>ERP 状态</dt><dd>${badge(esc(r.erpStatus), r.state==='APPROVED'?'success':'warning')}</dd>
          <dt>最近独立回读</dt><dd>${esc(r.verifiedAt)} · 共 ${r.readbacks} 次</dd>
          ${r.approver?`<dt>审批角色</dt><dd>${esc(r.approver)}</dd>`:''}
        </dl>
        ${r.state!=='UNKNOWN'?`<button class="button small" style="width:100%;margin-top:12px" data-act="req-refresh-one">重新回读 ERP 状态</button>`:''}
        <p class="micro" style="margin-top:10px">状态来自提交后的独立回读，不代表平台已执行审批。</p>
      </div></section>
      <section class="panel"><div class="panel-head"><h2>操作记录</h2></div><div class="panel-body" style="padding-top:4px">
        <div class="timeline">
          <div class="tl"><time>${esc(r.submittedAt.slice(11))}</time><p>${esc(r.confirmBy)} 确认数量 ${r.finalQty} ${esc(r.skuRef.unit)} 并提交。</p></div>
          ${r.state!=='UNKNOWN'?`<div class="tl"><time>${esc(r.submittedAt.slice(11))}</time><p>已提交 ERP，进入审批流程。</p></div>`:''}
          ${r.state==='APPROVED'?`<div class="tl"><time>${esc(r.verifiedAt.slice(11))}</time><p>回读确认 ERP 状态为已审批。</p></div>`:''}
          ${r.state==='UNKNOWN'?`<div class="tl"><time>09:41</time><p>提交结果未确认，等待原单核对。</p></div>`:''}
        </div>
      </div></section>
    </div>
  </div>`;
}

/* =====================================================================
   9. 渲染与事件
   ===================================================================== */
const PAGES = { workbench:pWorkbench, suggestions:pSuggestions, requisitions:pRequisitions };

function render(){
  const r = state.route;
  sidebar(); crumb();
  const main = document.getElementById('main');
  if (r.page==='sku') main.innerHTML = pSku(r.id);
  else if (r.page==='requisitions' && r.id) main.innerHTML = pRequisition(r.id);
  else main.innerHTML = (PAGES[r.page]||pWorkbench)();
  if (r.page==='suggestions'){ refreshRows(); bindFilters(); restoreListScroll(); }
  if (r.page==='sku') bindDetail();
}

function bindFilters(){
  const q = document.getElementById('f-q');
  if (!q) return;
  q.addEventListener('input', ()=>{
    state.filters.q = q.value; persistFilters(); refreshRows();
  });
  ['store','warehouse','source'].forEach(k=>{
    const el = document.getElementById('f-'+k);
    el.addEventListener('change', ()=>{ state.filters[k]=el.value; persistFilters(); refreshRows(); });
  });
}
function persistFilters(){
  const f = state.filters;
  sessionStorage.setItem('ux3.filters', JSON.stringify({q:f.q,store:f.store,warehouse:f.warehouse,source:f.source,stage:f.stage}));
  const tag = document.querySelector('.seg');
  if (tag) [...tag.querySelectorAll('button')].forEach(b=>b.setAttribute('aria-pressed', String((b.dataset.val||'')===f.stage)));
}
function restoreListScroll(){
  if (state.listScroll>0){ window.scrollTo(0,state.listScroll); state.listScroll=0; }
}

function bindDetail(){
  const input = document.getElementById('qty-input');
  if (!input) return;
  const s = byKey(state.route.id);
  input.addEventListener('input', ()=>{
    state.qty[s.key] = input.value;
    refreshRail(s);
  });
  const reason = document.getElementById('reason-input');
  if (reason) reason.addEventListener('input', ()=>{ state.reason[s.key]=reason.value; refreshRail(s); });
  const ack = document.getElementById('ack');
  if (ack) ack.addEventListener('change', ()=>{ state.ack[s.key]=ack.checked; refreshRail(s); });
}
function refreshRail(s){
  const qty = state.qty[s.key];
  const box = document.getElementById('rail-check');
  if (box) box.innerHTML = railCheck(s,qty);
  const wrap = document.getElementById('reason-wrap');
  if (wrap) wrap.hidden = String(qty)===String(s.plan.suggest);
  const btn = document.getElementById('submit-btn');
  if (btn) btn.disabled = !!validate(s,qty) || !state.ack[s.key];
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 4200);
}
function dialog(title, body, foot){
  const d = document.getElementById('dialog');
  document.getElementById('dialog-inner').innerHTML =
    `<div class="dlg-head"><h2>${esc(title)}</h2><button class="close" data-act="dlg-close" aria-label="关闭">×</button></div>
     <div class="dlg-body">${body}</div>${foot?`<div class="dlg-foot">${foot}</div>`:''}`;
  if (!d.open) d.showModal();
}
function closeDialog(){ const d=document.getElementById('dialog'); if (d.open) d.close(); }

document.addEventListener('click', function(ev){
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const s = state.route.page==='sku' ? byKey(state.route.id) : null;

  switch(act){
    case 'stage': {
      state.filters.stage = el.dataset.group; persistFilters();
      if (state.route.page!=='suggestions') go('/suggestions'); else render();
      break;
    }
    case 'go-req': go('/requisitions'); break;
    case 'open-list-all': state.filters = {q:'',store:'',warehouse:'',source:'',stage:''}; persistFilters(); break;
    case 'seg': {
      state.filters.stage = el.dataset.val||'';
      persistFilters();
      [...el.parentElement.querySelectorAll('button')].forEach(b=>b.setAttribute('aria-pressed',String(b===el)));
      refreshRows();
      break;
    }
    case 'clear': {
      state.filters = {q:'',store:'',warehouse:'',source:'',stage:''}; persistFilters(); render(); break;
    }
    case 'back-list': {
      state.listScroll = window.scrollY; break;
    }
    case 'tab': {
      state.tab = el.dataset.tab;
      const main = document.getElementById('main');
      const scroll = window.scrollY;
      main.innerHTML = pSku(s.key); bindDetail(); window.scrollTo(0,scroll);
      break;
    }
    case 'qty-step': {
      const step = Number(el.dataset.step);
      const cur = Number(state.qty[s.key]||s.plan.suggest);
      let next = cur + step;
      if (next < s.constraints.moq) next = s.constraints.moq;
      state.qty[s.key] = next;
      const input = document.getElementById('qty-input');
      if (input) input.value = next;
      refreshRail(s);
      break;
    }
    case 'confirm': {
      ev.preventDefault();
      const qty = Number(state.qty[s.key]);
      if (validate(s,qty) || !state.ack[s.key]) return;
      s.requisition = {
        no:'RQ-2026-0014', state:'SUBMITTED', erpStatus:'待审批',
        finalQty:qty, suggestQty:s.plan.suggest, reason:(state.reason[s.key]||'').trim(),
        submittedAt:'2026-11-14 09:58', confirmBy:'林予', verifiedAt:'2026-11-14 09:58', readbacks:1
      };
      render();
      toast(`已提交 ERP 请购 ${s.requisition.no} · 等待 ERP 领导审批`);
      break;
    }
    case 'ai-run': {
      dialog('按需生成 AI 解读',
        `<p>将对当前 SKU 已保存的事实生成一次解释，不重新读取 ERP、不计算库存与金额。</p>
         <dl class="kv"><dt>预计调用</dt><dd>1 次模型调用 · 预计 1.5k Token</dd><dt>失败影响</dt><dd>规则结果与建议数量保留，可稍后重试</dd></dl>
         <p class="micro" style="margin-top:10px">本原型不发起真实调用；正式页面需后端显式开启模型能力。</p>`,
        `<button class="button" data-act="dlg-close">取消</button><button class="button primary" data-act="dlg-close">确认生成（演示）</button>`);
      break;
    }
    case 'rerun': case 'rerun-single': {
      dialog('重新检查',
        `<p>${act==='rerun'?'将重新读取全部授权店仓对象的库存、销量与采购条件。':'将重新读取该 SKU 的最新事实并重算建议。'}</p>
         <p class="micro">只读操作：不调用模型、不创建采购、不修改 ERP。原报告按快照保留。</p>`,
        `<button class="button" data-act="dlg-close">取消</button><button class="button primary" data-act="dlg-close">开始检查（演示）</button>`);
      break;
    }
    case 'batch-dialog': {
      dialog('检查批次历史',
        `<p class="micro">本次检查结果按批次保留；切换后列表显示该批次的结果。</p>
         <div class="table-wrap"><table><thead><tr><th>检查时间</th><th class="r">对象数</th><th>状态</th><th></th></tr></thead><tbody>
         ${BATCH.history.map(b=>`<tr><td class="num">${esc(b.at)}</td><td class="r num">${b.objects}</td>
           <td>${b.complete?badge('完整','success'):badge('部分完成','warning')}</td>
           <td class="r">${b.id===state.batchId?badge('当前','plain'):`<button class="button small" data-act="dlg-close">切换</button>`}</td></tr>`).join('')}
         </tbody></table></div>`,
        `<button class="button" data-act="dlg-close">关闭</button>`);
      break;
    }
    case 'history-open': state.tab='history'; {
      const main = document.getElementById('main'); main.innerHTML = pSku(s.key); bindDetail(); break;
    }
    case 'history-detail': {
      dialog('历史分析快照',
        `<p>${esc(el.dataset.at)} 的分析结果按当时快照保留，仅可查看，不能直接复用为当前结论。</p>
         <p class="micro">如需按最新事实补货，请重新分析生成新版本。</p>`,
        `<button class="button primary" data-act="dlg-close">知道了</button>`);
      break;
    }
    case 'req-tab': state.reqTab = el.dataset.val; render(); break;
    case 'req-refresh': case 'req-refresh-one': {
      el.disabled = true; el.textContent = '正在回读…';
      setTimeout(()=>{ render(); toast('已重新回读 ERP 状态（演示，未连接真实 ERP）'); }, 700);
      break;
    }
    case 'req-check': {
      dialog('使用原单核对',
        `<p>不会创建第二张申请。系统将按原业务号查询 ERP 侧是否已生成单据，并核对其状态。</p>
         <dl class="kv"><dt>核对对象</dt><dd class="mono">RQ-2026-0012</dd><dt>已核对次数</dt><dd>1 次</dd><dt>若仍无法确认</dt><dd>保持「待核对」并转人工处理，不重复提交</dd></dl>`,
        `<button class="button" data-act="dlg-close">取消</button><button class="button primary" data-act="dlg-close">开始核对（演示）</button>`);
      break;
    }
    case 'evidence': {
      const k = el.dataset.kind;
      const map = {
        inv: ['可用库存', [['可用数量', num(s.plan.available)+' '+s.unit], ['仓库', s.warehouse], ['仓库匹配', '唯一记录，未发现分桶重复'], ['读取时点', '2026-11-14 08:01']]],
        sales: ['已核对销量', [['统计窗口', s.plan.window], ['完整业务日', (s.plan.salesDays||0)+' 天'], ['销量合计', (s.plan.totalSales||0)+' 件'], ['日均', (s.plan.avgDaily||'—')+' 件']]],
        po: ['正式采购', [['查询范围', '租户 / SKU / 仓库精确匹配'], ['单据数', s.purchases.length+' 张'], ['可售日期', 'ERP 未提供已承诺可售日'], ['读取时点', '2026-11-14 08:02']]],
        quote: ['供应商报价', [['供应商', s.constraints.supplier||'未确认'], ['报价号', s.constraints.quote||'未确认'], ['单价', money(s.constraints.price,s.constraints.currency)], ['有效期', s.constraints.quoteValid||'未知'], ['MOQ / 倍数', `${num(s.constraints.moq)} / ${num(s.constraints.multiple)}`]]]
      };
      const item = map[k];
      dialog('依据：' + item[0],
        `<dl class="kv">${item[1].map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>
         <p class="micro" style="margin-top:12px">仅展示本次判定实际使用的字段值，可追溯到本次快照；不提供 ERP 原始响应。</p>`,
        `<button class="button primary" data-act="dlg-close">关闭</button>`);
      break;
    }
    case 'dlg-close': closeDialog(); break;
  }
});

document.getElementById('dialog').addEventListener('click', e=>{ if (e.target.id==='dialog') closeDialog(); });
window.addEventListener('hashchange', navigatePath);

/* 初始进入 */
SKUS.forEach(s=>{ state.qty[s.key]=s.plan.suggest||0; });
if (!location.hash) location.replace('#/workbench');
navigatePath();
})();
</script>
