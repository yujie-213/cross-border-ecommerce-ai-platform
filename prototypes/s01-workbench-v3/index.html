<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>序衡 · S01 采购补货工作台</title>
<style>
:root{
  --canvas:#f2f4f7;--surface:#fff;--ink:#1b2836;--muted:#5d6b7a;--subtle:#7c8896;--line:#e2e7ec;
  --control:#8b97a4;--primary:#0f6b64;--primary-dark:#0a5751;--sel:#e8f2f0;--nav:#16293a;
  --ok:#1f6a4a;--ok-bg:#eaf4ee;--warn:#8a5a0d;--warn-bg:#fdf3e2;--bad:#a8382f;--bad-bg:#fbeeec;
  --info:#2f5c8a;--info-bg:#eef3fa;--r:7px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:13px/1.55 "Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
button,input,select,textarea{font:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:21px;line-height:1.3;font-weight:650;letter-spacing:-.2px}
h2{font-size:13.5px;font-weight:600}
h3{font-size:12.5px;font-weight:600}
a{color:var(--primary);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{cursor:pointer;transition:background .12s,border-color .12s}
button:disabled{cursor:not-allowed;background:#f1f3f5!important;color:#8b959f!important;border-color:#dde2e7!important}
:focus-visible{outline:2px solid #2563a8;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.skip{position:fixed;top:-70px;left:8px;z-index:60;background:#fff;padding:8px 12px;border:1px solid var(--line)}
.skip:focus{top:8px}
.mono{font-family:Consolas,monospace;font-size:11.5px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* shell */
.sidebar{position:fixed;inset:0 auto 0 0;width:212px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 14px;z-index:20}
.brand{display:flex;gap:9px;align-items:center;padding:0 6px;text-decoration:none;color:var(--nav)}
.brand:hover{text-decoration:none}
.brand-symbol{display:grid;place-items:center;width:30px;height:34px;background:var(--nav);color:#fff;font-size:17px;border-radius:8px 3px 8px 3px}
.brand b{font-size:18px;font-weight:650;letter-spacing:.5px}
.brand small{display:block;font-size:7.5px;letter-spacing:1px;color:var(--muted);font-weight:600}
.workspace{display:flex;align-items:center;gap:7px;background:#f7f9fa;border:1px solid var(--line);border-radius:6px;padding:8px;margin:16px 0 14px;font-size:11.5px;font-weight:600}
.workspace small{display:block;font-size:9.5px;font-weight:400;color:var(--muted)}
.ws-icon{width:22px;height:22px;flex:none;display:grid;place-items:center;background:#e9eef1;border-radius:4px;font-weight:400;font-size:11px}
.nav-label{font-size:10.5px;color:var(--subtle);padding:0 8px 4px;letter-spacing:.3px}
nav a{display:flex;align-items:center;gap:8px;min-height:36px;padding:6px 8px;margin:1px 0;border-radius:5px;color:#41505f;font-size:12.5px;text-decoration:none}
nav a:hover{background:#f4f6f8;text-decoration:none}
nav a.active{color:var(--primary);background:var(--sel);font-weight:600}
nav a.sub{padding-left:30px;font-size:11.5px;min-height:30px;color:var(--muted)}
nav a.sub.active{color:var(--primary)}
.nav-icon{width:16px;text-align:center;flex:none;opacity:.75;font-size:13px}
.nav-count{margin-left:auto;font-size:10.5px;background:#e6edec;color:#1c5a55;border-radius:8px;padding:0 6px;font-weight:600}
nav a.active .nav-count{background:#cfe4e0}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding:10px 8px 0;font-size:9.5px;color:var(--subtle);line-height:1.6;letter-spacing:.2px}
.shell{margin-left:212px;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:54px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:15}
.crumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;min-width:0}
.crumb i{color:#aab3bd;font-style:normal}
.crumb b{color:var(--ink);font-weight:600}
.top-right{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted)}
.demo-chip{display:inline-flex;align-items:center;gap:4px;background:#f3f5f7;color:#6c7a88;border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:10.5px;cursor:help}
.who{display:flex;align-items:center;gap:6px}
.avatar{width:22px;height:22px;border-radius:50%;background:#e8eef0;display:grid;place-items:center;color:#3c5a6b;font-size:10px}
main{padding:18px 22px 30px;max-width:1640px;width:100%;flex:1}
footer{padding:0 22px 14px;font-size:10px;color:var(--subtle);display:flex;justify-content:space-between;gap:10px}
/* primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:30px;padding:5px 11px;background:#fff;border:1px solid var(--control);border-radius:5px;font-size:11.5px;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{background:#f5f8f9;text-decoration:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.sm{min-height:26px;font-size:11px;padding:3px 8px}
.btn.ghost{border-color:transparent;background:none;color:var(--primary);padding:2px 0;min-height:22px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel+.panel{margin-top:12px}
.panel-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;min-height:41px}
.panel-head h2{font-size:13px}
.panel-head .sub{font-size:10.5px;color:var(--subtle);font-weight:400}
.panel-body{padding:14px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;line-height:1.5;padding:1.5px 7px;border-radius:4px;font-weight:500;background:#eff2f5;color:#52616f;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.line{background:#fff;border:1px solid var(--line);color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none}
/* workbench */
.overview{display:block}
.kpis{border-bottom:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:4px 0 12px}
.kpi{padding:10px 14px;border-right:1px solid var(--line);text-align:left;background:none;border-top:0;border-bottom:0;border-left:0;color:var(--ink);display:block}
.kpi:last-child{border-right:0}
.kpi:hover{background:#fafcfc}
.kpi .n{font-size:24px;font-weight:650;line-height:1.25;letter-spacing:-.5px;display:flex;align-items:baseline;gap:5px}
.kpi .n em{font-style:normal;font-size:10.5px;font-weight:400;color:var(--muted)}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:1px}
.dist{padding:6px 14px 14px}
.distbar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:#eef1f4;margin-bottom:8px}
.distbar i{display:block;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:10.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{font-weight:600;color:var(--ink)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;align-items:start;margin-top:12px}
.cols>*{min-width:0}
.queue{display:grid}
.qhead{display:grid;grid-template-columns:minmax(0,1fr) 128px 96px 108px 22px;gap:10px;padding:6px 14px;font-size:10.5px;color:var(--subtle);background:#fbfcfd;border-bottom:1px solid var(--line)}
.qhead span:nth-child(3){padding-left:2px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 128px 96px 108px 22px;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid #eef1f4;text-decoration:none;color:inherit}
.qrow:last-child{border-bottom:0}
.qrow:hover{background:#f8fbfa;text-decoration:none}
.prod{font-weight:600;font-size:12.5px;line-height:1.35;display:block}
.prod-sub{display:block;font-size:10.5px;color:var(--subtle);font-weight:400;margin-top:1px}
.cov{height:5px;background:#edf0f3;border-radius:3px;overflow:hidden;margin-top:4px}
.cov i{display:block;height:100%;background:var(--primary);border-radius:3px}
.cov.low i{background:#c9812f}
.cov.out i{background:#b4483d}
.cov-num{font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}
.bignum{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.bignum small{font-size:10px;font-weight:400;color:var(--muted);margin-left:2px}
.mini-row{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:11px;padding:5px 0}
.mini-row .t{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.mini-row .track{height:6px;background:#eef1f4;border-radius:3px;overflow:hidden}
.mini-row .track i{display:block;height:100%;background:#7fa8a2}
.meta-list{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:11.5px;margin:0}
.meta-list dt{color:var(--muted)}
.meta-list dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
/* filters */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px}
.filters input[type=search],.filters select{border:1px solid var(--control);border-radius:5px;padding:5px 8px;font-size:11.5px;background:#fff;min-height:29px;color:var(--ink)}
.filters input[type=search]{width:210px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.seg button{border:0;border-right:1px solid var(--line);background:none;font-size:11.5px;padding:6px 10px;color:var(--muted);min-height:29px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--primary);font-weight:600}
.seg em{font-style:normal;font-size:10px;margin-left:4px;color:var(--subtle)}
.seg button[aria-pressed=true] em{color:var(--primary)}
/* tables */
.tw{overflow:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;font-size:10.5px;font-weight:500;color:var(--muted);background:#f8fafb;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #eef1f4;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f9fbfb}
td.r,th.r{text-align:right}
.ltable{min-width:820px}
.ltable th,.ltable td:nth-child(4),.ltable td:nth-child(5),.ltable td:nth-child(6),.ltable td:nth-child(7),.ltable td:nth-child(8){white-space:nowrap}
.ltable th:last-child,.ltable td:last-child{position:sticky;right:0;background:#fff;box-shadow:-6px 0 6px -6px #0000001a}
.ltable th:last-child{background:#f8fafb}
.stockcell{display:flex;align-items:center;gap:7px;min-width:112px}
.stockcell .cov{width:52px;margin-top:0;flex:none}
.stockcell span{font-variant-numeric:tabular-nums;font-size:11.5px}
.empty{padding:30px 18px;text-align:center;color:var(--muted);font-size:12px}
.empty h3{color:var(--ink);margin-bottom:5px}
/* detail */
.back{font-size:11.5px;display:inline-flex;align-items:center;gap:5px;margin-bottom:8px;color:var(--muted)}
.detail-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:12px}
.detail-head h1{font-size:19px}
.sku-meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.verdict{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr 1fr;border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;margin-bottom:12px}
.verdict>div{padding:9px 14px;border-right:1px solid var(--line);min-width:0}
.verdict>div:last-child{border-right:0}
.verdict small{display:block;font-size:10.5px;color:var(--muted)}
.verdict b{font-size:18px;font-weight:650;line-height:1.4;font-variant-numeric:tabular-nums}
.verdict b span{font-size:10.5px;font-weight:400;color:var(--muted);margin-left:2px}
.verdict .accent b{color:var(--primary)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 318px;gap:12px;align-items:start}
.rail{position:sticky;top:66px;display:grid;gap:12px}
.chart-wrap{padding:10px 14px 4px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:10px "Segoe UI","Microsoft YaHei",sans-serif;fill:#6b7885}
.chart .lbl-strong{font-weight:600;fill:#41505f}
.chart-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);padding:2px 14px 10px}
.chart-legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:4px}
.chart-legend i.dash{background:repeating-linear-gradient(to right,#9aa7b3 0 3px,transparent 3px 6px)}
.chart-legend i.area{height:9px;border-radius:2px;background:#fbeceb}
.two{display:grid;grid-template-columns:minmax(0,1fr) 236px;gap:16px;padding:0 14px 12px;align-items:start}
.two .bars{max-width:264px}
.formula{border:1px solid var(--line);border-radius:6px;background:#fbfcfd;padding:9px 11px;font-size:11.5px;line-height:1.9;color:#43505d}
.formula b{font-variant-numeric:tabular-nums;color:var(--ink)}
.formula .op{color:var(--subtle);padding:0 4px}
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;background:none;font-size:12px;color:var(--muted);min-height:38px;padding:4px 0;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab-body{padding:14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin:0}
.kv>div{padding:6px 0;border-bottom:1px solid #f1f3f5;font-size:12px;display:flex;justify-content:space-between;gap:10px}
.kv dt{color:var(--muted);font-size:11.5px}
.kv dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.stack{display:flex;height:9px;border-radius:3px;overflow:hidden;background:#eef1f4;margin-top:5px}
.stack i{display:block;height:100%}
.check{display:flex;gap:7px;align-items:flex-start;font-size:11px;line-height:1.55;margin:8px 0;color:#45525f}
.check input{margin-top:2px;accent-color:var(--primary);flex:none}
.qitem{padding:8px 0;border-bottom:1px solid #f1f3f5}
.qitem:last-child{border-bottom:0}
.qitem .qt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:12px}
.qitem p{font-size:11px;color:var(--muted);line-height:1.65;margin-top:2px}
/* rail */
.rail .panel-head{padding:9px 13px}
.rail .panel-body{padding:13px}
.qty-now{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:9px}
.qty-now span{font-size:11px;color:var(--muted)}
.qty-now b{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.stepper{display:flex;gap:5px}
.stepper button{width:30px;min-height:32px;border:1px solid var(--control);background:#fff;border-radius:5px;font-size:14px;color:var(--ink)}
.stepper input{flex:1;min-width:0;border:1px solid var(--control);border-radius:5px;padding:5px 8px;font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.hint{font-size:10.5px;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:4px 7px;margin-top:5px;line-height:1.5}
.hint.bad{color:var(--bad);background:var(--bad-bg)}
.hint.ok{color:var(--ok);background:var(--ok-bg)}
.rail-note{font-size:10px;color:var(--subtle);margin-top:7px;line-height:1.5}
/* requisitions */
.steps{display:flex;border:1px solid var(--line);border-radius:6px;background:#fff;overflow:auto;margin-bottom:14px}
.step{flex:1;min-width:132px;padding:8px 12px;font-size:11px;color:var(--muted);border-right:1px solid var(--line)}
.step:last-child{border-right:0}
.step b{display:block;font-size:11.5px;font-weight:600;color:#44515e;margin-bottom:1px}
.step.done{background:#f5faf7}.step.done b{color:var(--ok)}
.step.now{background:var(--sel)}.step.now b{color:var(--primary)}
.step.wait{background:var(--warn-bg)}.step.wait b{color:var(--warn)}
.step.todo{opacity:.55}
.prog{display:flex;align-items:center;gap:3px}
.prog i{width:16px;height:3px;border-radius:2px;background:#e2e7ec;display:block}
.prog i.on{background:var(--primary)}
.prog i.warn{background:#c9812f}
.alert-row{display:flex;align-items:center;gap:10px;border:1px solid #ecc9c5;border-left:3px solid var(--bad);background:#fdf1f0;border-radius:5px;padding:7px 12px;font-size:11.5px;margin-bottom:10px;color:#83342c}
.tl{display:grid;grid-template-columns:74px minmax(0,1fr);gap:8px;font-size:11px;padding:6px 0;border-bottom:1px dashed #eef1f4}
.tl:last-child{border-bottom:0}
.tl time{color:var(--subtle);font-variant-numeric:tabular-nums}
/* dialog */
dialog{border:0;padding:0;border-radius:8px;width:min(560px,calc(100vw - 28px));max-height:82vh;color:var(--ink);box-shadow:0 16px 44px #16293a2e}
dialog::backdrop{background:#12283b55}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:14px}
.dlg-body{padding:14px 16px;font-size:11.5px;line-height:1.75}
.dlg-foot{padding:11px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:7px}
.close{border:0;background:none;font-size:19px;color:var(--muted);line-height:1}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#16293a;color:#fff;padding:9px 15px;border-radius:5px;font-size:11.5px;z-index:50;max-width:calc(100vw - 24px)}
/* responsive */
@media (max-width:1280px){
  .cols,.detail{grid-template-columns:1fr}
  .cols>.side{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}
  .cols>.side>.panel+.panel{margin-top:0}
  .cols>.side>.panel{min-width:0}
  .rail{position:static;grid-template-columns:1fr 1fr;align-items:start}
  .qrow{grid-template-columns:minmax(0,1fr) 118px 96px 100px 20px}
}
@media (max-width:1000px){
  .sidebar{position:static;width:auto;flex-direction:row;align-items:center;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);gap:4px;overflow-x:auto}
  .brand b{font-size:16px}.brand-symbol{width:26px;height:29px;font-size:15px}
  .workspace,.nav-label,.sidebar-foot{display:none}
  nav{display:flex;gap:2px;flex:none}
  nav a{min-height:32px;padding:5px 9px;font-size:11.5px;margin:0}
  nav a.sub{display:none}.nav-icon{display:none}
  .shell{margin-left:0}
  .topbar{position:static;height:46px;padding:0 14px}
  main{padding:14px 14px 24px}
  footer{padding:0 14px 12px}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .verdict{grid-template-columns:repeat(3,1fr)}
  .verdict>div:nth-child(3){border-right:0}
  .verdict>div:nth-child(4),.verdict>div:nth-child(5){border-top:1px solid var(--line)}
  .verdict>div:nth-child(5){border-right:0}
  .rail{grid-template-columns:1fr}
  .ltable{min-width:700px}
  .ltable th:nth-child(6),.ltable td:nth-child(6){display:none}
  .qrow{grid-template-columns:minmax(0,1fr) 110px 96px 18px}
  .qrow .qhide{display:none}
}
@media (max-width:680px){
  .page-head{flex-direction:column;align-items:flex-start;gap:8px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi:nth-child(2){border-right:0}

const batch=()=>BATCHES.find(b=>b.id===state.batchId)||BATCHES[0];

function items(){
  const over=batch().over;
  return SKUS.map(s=>{
    const o=over[s.key]||{};
    if(o.missing)return Object.assign({},s,{missing:true});
    return Object.assign({},s,{plan:Object.assign({},s.plan,o)});
  });
}
const byKey=k=>items().find(s=>s.key===k);

function stageOf(s){
  if(s.missing)return 'missing';
  if(s.checks.some(c=>c.code==='FAILED'))return 'failed';
  if(s.checks.some(c=>c.level==='BLOCK'))return 'blocked';
  if(s.req){
    if(s.req.plat==='UNKNOWN')return 'req_unknown';
    if(s.req.erp==='APPROVED')return 'req_approved';
    return 'req_waiting';
  }
  if(s.source==='NONE')return 'blocked';
  if(!s.plan.suggest)return 'no_need';
  return 'confirm';
}
const STAGE={
  confirm:{l:'待确认',tone:'info',g:'待确认'},
  blocked:{l:'需补证',tone:'warn',g:'需补证'},
  no_need:{l:'无需补货',tone:'',g:'无需补货'},
  req_waiting:{l:'待 ERP 审批',tone:'info',g:'已请购'},
  req_approved:{l:'ERP 已审批',tone:'ok',g:'已请购'},
  req_unknown:{l:'提交待核对',tone:'bad',g:'已请购'},
  failed:{l:'分析失败',tone:'bad',g:'失败'},
  missing:{l:'本批次未含',tone:'',g:'未分析'}
};
const stageBadge=s=>{const x=STAGE[stageOf(s)];return `<span class="chip ${x.tone}">${x.l}</span>`;};
const groupOf=s=>STAGE[stageOf(s)].g;

function counts(){
  const c={confirm:0,blocked:0,no_need:0,waiting:0,approved:0,unknown:0,failed:0,missing:0};
  items().forEach(s=>{
    const st=stageOf(s);
    if(st==='req_waiting')c.waiting++;
    else if(st==='req_approved')c.approved++;
    else if(st==='req_unknown')c.unknown++;
    else c[st]++;
  });
  c.inreq=c.waiting+c.unknown;
  c.actionable=c.confirm+c.blocked+c.failed+c.unknown+c.missing;
  return c;
}

/* ================= 图形 ================= */
function chartBalance(daily){
  if(!daily||!daily.length)return '';
  const W=720,H=190,L=34,R=12,T=18,B=28;
  const vals=daily.map(d=>d.close);
  const max=Math.max(10,...vals),min=Math.min(-5,...vals);
  const pad=(max-min)*0.12,hi=max+pad,lo=Math.min(0,min)-pad;
  const x=i=>L+i*(W-L-R)/(daily.length-1);
  const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const y0=y(0);
  const line=daily.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(d.close).toFixed(1)}`).join(' ');
  const area=`${line} L${x(daily.length-1).toFixed(1)},${y0.toFixed(1)} L${x(0).toFixed(1)},${y0.toFixed(1)} Z`;
  const fs=daily.findIndex(d=>d.close<0);
  const shortRect=fs<0?'':`<rect x="${x(fs).toFixed(1)}" y="${T}" width="${(W-R-x(fs)).toFixed(1)}" height="${(H-T-B).toFixed(1)}" fill="#fdf0ee"/>`;
  const arrivals=daily.map((d,i)=>d.arr>0?`
    <line x1="${x(i).toFixed(1)}" y1="${T}" x2="${x(i).toFixed(1)}" y2="${H-B}" stroke="#b9c7cf" stroke-dasharray="3 3"/>
    <circle cx="${x(i).toFixed(1)}" cy="${y(d.close).toFixed(1)}" r="3.4" fill="#fff" stroke="#0f6b64" stroke-width="1.6"/>
    <text x="${x(i).toFixed(1)}" y="${T-5}" text-anchor="middle" class="lbl-strong">+${d.arr}</text>`:'').join('');
  const dots=daily.map((d,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(d.close).toFixed(1)}" r="2.6" fill="${d.close<0?'#b4483d':'#0f6b64'}"/>`).join('');
  const xlab=daily.map((d,i)=>i%2===0?`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${d.d}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="预计结存：${daily.map(d=>d.d+' '+d.close).join('，')}">${shortRect}
    <line x1="${L}" y1="${y0}" x2="${W-R}" y2="${y0}" stroke="#c9d3da"/>
    <text x="${L-6}" y="${y0+3}" text-anchor="end">0</text>
    <text x="${L-6}" y="${y(hi)+3}" text-anchor="end">${Math.round(hi)}</text>
    ${(H-B)-y(lo)>12?`<text x="${L-6}" y="${y(lo)+3}" text-anchor="end">${Math.round(lo)}</text>`:''}
    <path d="${area}" fill="#e8f2f0"/><path d="${line}" fill="none" stroke="#0f6b64" stroke-width="2"/>
    ${arrivals}${dots}${xlab}</svg>`;
}

function chartSales(sales,total){
  const W=228,H=80,L=2,R=2,T=8,B=15;
  if(!sales||!sales.length)return '<div class="muted" style="font-size:10.5px;padding:8px 0">本次未取得已核对销量</div>';
  const max=Math.max(...sales),col=(W-L-R)/7,bw=col-4;
  const bars=sales.map((q,i)=>{
    const h=(q/max)*(H-T-B),x=L+i*col+2;
    return `<rect x="${x.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="#9dc0bb"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${H-3}" text-anchor="middle">${['04','05','06','07','08','09','10'][i]}</text>`;
  }).join('');
  const avg=total?total/sales.length:0,ay=H-B-(avg/max)*(H-T-B);
  const base=`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#dde3e8"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="最近 ${sales.length} 个业务日销量 ${sales.join('、')} 件">${base}${bars}
    <line x1="${L}" y1="${ay.toFixed(1)}" x2="${W-R}" y2="${ay.toFixed(1)}" stroke="#c9812f" stroke-dasharray="4 3"/></svg>`;
}

function parse(){
  const p=location.hash.replace(/^#\/?/,'').split('/');
  return {page:p[0]||'workbench',id:decodeURIComponent(p[1]||'')||null,tab:p[2]||null};
}
function go(path){location.hash===path?render():(location.hash=path);}
function onRoute(){
  const r=parse();
  if(r.page==='sku'&&!byKey(r.id)){location.replace('#/suggestions');return;}
  state.route=r;
  if(r.page==='sku'){
    state.lastSku=r.id;sessionStorage.setItem('ux3.lastSku',r.id);
    state.tab=['conditions','quality','history'].includes(r.tab)?r.tab:'conditions';

}

function match(s){
  const f=state.filters,t=f.q.trim().toLowerCase();
  if(t&&!(s.sku.toLowerCase().includes(t)||s.name.toLowerCase().includes(t)))return false;
  if(f.store&&s.store!==f.store)return false;
  if(f.wh&&s.wh!==f.wh)return false;
  if(f.source&&s.source!==f.source)return false;
  if(f.stage&&groupOf(s)!==f.stage)return false;
  return true;
}

  const p=s.plan,c=s.constraints,st=stageOf(s);
  if(st==='blocked'||st==='failed')return '<div class="formula muted">阻断未解除，不计算建议数量。</div>';
  if(s.source==='ERP')return `<div class="formula"><b>ERP 建议 ${p.suggest} ${esc(s.unit)}</b><div style="font-size:10.5px;color:var(--muted)">依据未核实，核对采购条件后确认</div></div>`;
  if(!p.suggest)return `<div class="formula">目标 <b>${p.target}</b><span class="op">−</span>可用 <b>${p.available}</b><span class="op">=</span><b>0</b> 缺口</div>`;
  const need=Math.max(0,p.target-p.available);
  const up=Math.ceil(need/(c.mult||1))*(c.mult||1);
  const qty=Math.max(up,c.moq||0);
  return `<div class="formula">目标 <b>${p.target}</b><span class="op">−</span>可用 <b>${p.available}</b><span class="op">−</span>在途 <b>0</b><span class="op">=</span>缺口 <b>${need}</b><br>MOQ <b>${c.moq}</b> / 整箱 <b>${c.mult}</b><span class="op">→</span><b>${qty} ${esc(s.unit)}</b></div>`;
}

function tabBody(s){
  if(state.tab==='quality')return qualityTab(s);
  if(state.tab==='history')return histTab(s);
  return conditionsTab(s);
}
function conditionsTab(s){

    <div class="stack"><i style="width:${s.purchases[0].recv/s.purchases[0].ordered*100}%;background:#0f6b64"></i><i style="width:${s.purchases[0].unrecv/s.purchases[0].ordered*100}%;background:#c9d6d3"></i></div>
    <div class="cov-num" style="margin-top:3px"><span>已收 ${s.purchases[0].recv}</span><span>待收 ${s.purchases[0].unrecv}</span></div>
    <div class="rail-note">待到货单据无已承诺可售日，未计入有效在途。</div>`

    <div><dt>整箱倍数</dt><dd>${dash(c.mult)}${c.mult?' '+esc(s.unit):''}</dd></div>
    <div><dt>报价单价</dt><dd>${money(c.price,c.cur)}</dd></div>
    <div><dt>报价有效期</dt><dd>${c.validTo?'至 '+c.validTo:'—'}</dd></div>
    <div><dt>供应商</dt><dd>${esc(c.supplier||'—')}</dd></div>
    <div><dt>参考交期</dt><dd>${c.lead?c.lead+' 天':'—'}</dd></div>
  </dl>
  <h3 style="margin:12px 0 0;font-size:11.5px;color:var(--muted);font-weight:500">已有正式采购</h3>${po}`;
}
function qualityTab(s){
  const html=s.checks.length?s.checks.map(c=>`
    <div class="qitem"><div class="qt"><span class="chip ${c.level==='BLOCK'?'bad':'warn'}">${c.level==='BLOCK'?'阻断':'提示'}</span>${esc(c.title)}</div>
      <p>${esc(c.detail)}</p>
      ${c.draft?`<p><span class="chip line">政策草案 · 未生效</span> ${esc(c.draft)}</p>`:''}
      <p>责任方 ${esc(c.owner)} · 下一步 ${esc(c.action)}</p></div>`).join('')
    :'<div class="muted" style="font-size:11.5px;padding:6px 0">本次无未解决的数据或规则限制。</div>';
  return `${html}
  <div style="margin-top:12px;font-size:11px;color:var(--muted)">
    数据来源：库存 ${dash(s.plan.available)} · 销量 ${s.plan.salesDays?s.plan.salesDays+' 个业务日':'未取得'} · 采购条件 ${s.constraints.quote?'已读取':'未取得'}
    <button class="btn ghost" data-act="evidence">查看字段</button>
  </div>
  <details style="margin-top:8px"><summary style="font-size:10.5px;color:var(--muted);cursor:pointer">技术信息</summary>
    <div class="mono muted" style="margin-top:5px;font-size:10.5px">快照 snapshot-${batch().id}-${s.sku.toLowerCase()} · 租户 teaching-tenant · 口径 v2</div>
  </details>`;
}
function histTab(s){
  return `<div class="tw"><table><caption class="sr-only">历史分析</caption>
    <thead><tr><th>时间</th><th>来源</th><th class="r">建议</th><th>结果</th><th></th></tr></thead>
    <tbody>${s.hist.map(h=>`<tr><td class="num">${esc(h.at)}</td><td>${esc(h.src)}</td>
      <td class="r num">${h.qty===null?'—':h.qty+' '+esc(s.unit)}</td><td>${esc(h.res)}</td>
      <td class="r"><button class="btn sm" data-act="hist">查看</button></td></tr>`).join('')}</tbody></table></div>`;
}

function rail(s){
  const st=stageOf(s),p=s.plan,c=s.constraints;
  if(st==='req_waiting'||st==='req_approved'||st==='req_unknown')return railReq(s);
  if(st==='no_need')return `<section class="panel"><div class="panel-head"><h2>无需补货</h2></div><div class="panel-body">
    <div class="muted" style="font-size:11.5px">可用 ${p.available} 件覆盖 ${covDays(s)} 天，未生成采购建议。</div>
    <button class="btn" style="width:100%;margin-top:10px" data-act="rerun">重新分析</button></div></section>`;
  if(st==='blocked'||st==='failed'||st==='missing'){
    const b=s.checks.find(x=>x.level==='BLOCK')||s.checks[0]||{title:'本批次未包含该对象',owner:'—',action:'切换到最新批次'};
    return `<section class="panel"><div class="panel-head"><h2>暂不可提交</h2></div><div class="panel-body">
      <div class="hint bad">${esc(b.title)}</div>
      <div class="muted" style="font-size:11px;margin-top:6px">责任方 ${esc(b.owner)} · ${esc(b.action)}</div>
      <button class="btn" style="width:100%;margin-top:10px" data-act="rerun">重新分析</button></div></section>`;
  }
  const qty=state.qty[s.key];
  return `<section class="panel">
    <div class="panel-head"><h2>请购</h2><span class="chip ${s.source==='ERP'?'warn':'ok'}">${s.source==='ERP'?'ERP 参考':'规则建议'}</span></div>
    <div class="panel-body">
      <div class="qty-now"><span>建议数量</span><b>${p.suggest} <span style="font-size:11px;color:var(--muted)">${esc(s.unit)}</span></b></div>
      <div class="stepper">
        <button type="button" data-act="step" data-v="-${c.mult}">−</button>
        <input id="qty" type="number" min="1" step="${c.mult}" value="${qty}" inputmode="numeric" aria-label="最终数量">
        <button type="button" data-act="step" data-v="${c.mult}">+</button>
      </div>
      <div class="muted" style="font-size:10.5px;margin-top:4px">MOQ ${c.moq} · 整箱 ${c.mult}${s.source==='ERP'?' · 依据未核实':''}</div>
      <div id="rail-check">${railCheck(s,qty)}</div>
      <div id="reason-wrap" ${String(qty)===String(p.suggest)?'hidden':''} style="margin-top:6px">
        <textarea id="reason" maxlength="200" placeholder="调整原因（必填）" style="width:100%;min-height:46px;border:1px solid var(--control);border-radius:5px;padding:5px 8px;font-size:11.5px">${esc(state.reason[s.key]||'')}</textarea>
      </div>
      <label class="check"><input type="checkbox" id="ack" ${state.ack[s.key]?'checked':''}><span>已核对采购条件与在途</span></label>
      <button class="btn primary" id="submit" style="width:100%" data-act="confirm" ${railValid(s,qty)?'':'disabled'}>提交请购</button>
      <p class="rail-note">提交后进入 ERP 审批，平台只读回读状态。</p>
    </div></section>`;
}
function railValid(s,q){return !railError(s,q)&&!!state.ack[s.key];}
function railError(s,q){
  const c=s.constraints;
  if(!q||!Number.isInteger(Number(q)))return '请填写整数数量';
  if(Number(q)<c.moq)return `低于 MOQ ${c.moq}`;
  if(Number(q)%c.mult)return `须为整箱 ${c.mult} 的整数倍`;
  if(Number(q)!==s.plan.suggest&&!(state.reason[s.key]||'').trim())return '调整数量需填写原因';
  return '';
}
function railCheck(s,q){
  const e=railError(s,q);
  return e?`<div class="hint">${esc(e)}</div>`:'<div class="hint ok">数量符合约束</div>';
}
function railReq(s){
  const r=s.req,tone=r.plat==='UNKNOWN'?'bad':r.erp==='APPROVED'?'ok':'info';
  const label=r.plat==='UNKNOWN'?'提交待核对':r.erp==='APPROVED'?'ERP 已审批':'待 ERP 审批';
  return `<section class="panel"><div class="panel-head"><h2>请购单</h2><span class="chip ${tone}">${label}</span></div>
    <div class="panel-body">
      <div class="qty-now"><span>最终数量</span><b>${r.finalQty} <span style="font-size:11px;color:var(--muted)">${esc(s.unit)}</span></b></div>
      <dl class="meta-list">
        <dt>单据号</dt><dd class="mono">${esc(r.no)}</dd>
        <dt>平台状态</dt><dd>${r.plat==='UNKNOWN'?'已提交·未确认':'已提交'}</dd>
        <dt>ERP 状态</dt><dd>${r.erp==='APPROVED'?'已审批':r.erp==='UNKNOWN'?'未知':'待审批'}</dd>
        <dt>建议 / 最终</dt><dd>${r.sugQty} / ${r.finalQty}</dd>
      </dl>
      ${r.plat==='UNKNOWN'?'<button class="btn" style="width:100%;margin-top:8px" data-act="recheck">原单核对</button>':''}
      <a class="btn" style="width:100%;margin-top:8px;justify-content:center" href="#/requisitions/${encodeURIComponent(r.no)}">查看请购单</a>
    </div></section>`;
}
function aiCard(s){
  if(s.ai.status==='OK'){
    return `<section class="panel"><div class="panel-head"><h2>AI 解读</h2><span class="chip info">本次分析</span></div>
      <div class="panel-body" style="font-size:11.5px;line-height:1.6;color:#41505f">
        <ul style="margin:0;padding-left:15px">${s.ai.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
        <div class="hint" style="margin-top:7px">${esc(s.ai.risk)}</div>

/* ================= 请购管理 ================= */
function reqs(){return SKUS.filter(s=>s.req).map(s=>Object.assign({k:s},s.req)).sort((a,b)=>a.at<b.at?1:-1);}
function pageReqs(){
  const all=reqs(),f=state.reqTab;
  const rows=all.filter(r=>f==='all'||(f==='waiting'&&r.erp==='PENDING'&&r.plat!=='UNKNOWN')||(f==='approved'&&r.erp==='APPROVED')||(f==='check'&&r.plat==='UNKNOWN'));
  const unk=all.filter(r=>r.plat==='UNKNOWN').length;
  const cnt={pending:all.filter(r=>r.erp==='PENDING'&&r.plat!=='UNKNOWN').length,approved:all.filter(r=>r.erp==='APPROVED').length,check:unk};
  const platLabel=r=>r.plat==='UNKNOWN'?'已提交 · 未确认':'已提交';
  const erpLabel=r=>r.erp==='APPROVED'?'已审批':r.erp==='UNKNOWN'?'未知':'待审批';
  const segs=[['待审批',cnt.pending,'#4a7fa8'],['已审批',cnt.approved,'#6f9a86'],['待核对',cnt.check,'#b4483d']].filter(x=>x[1]>0);

  <div class="page-head"><h1>请购管理</h1><button class="btn sm" data-act="refresh">刷新 ERP 状态</button></div>
  ${unk?`<div class="alert-row"><span class="chip bad">${unk} 单待核对</span><span>提交结果未确认，ERP 可能已建单。</span><a class="btn sm" style="margin-left:auto" data-act="reqtab" data-v="check">查看</a></div>`:''}

      <button data-act="reqtab" data-v="approved" aria-pressed="${f==='approved'}">已审批<em>${cnt.approved}</em></button>
      <button data-act="reqtab" data-v="check" aria-pressed="${f==='check'}">待核对<em>${cnt.check}</em></button>

      <div class="panel-body">
        <div class="distbar" role="img" aria-label="待审批 ${cnt.pending}，已审批 ${cnt.approved}，待核对 ${cnt.check}">
          ${segs.map(x=>`<i style="flex:${x[1]};background:${x[2]}"></i>`).join('')}
        </div>
        <div class="legend">${segs.map(x=>`<span><i class="dot" style="background:${x[2]}"></i>${x[0]} <b>${x[1]}</b></span>`).join('')}
          <span style="margin-left:auto">进度：提交 → ERP 受理 → ERP 审批</span></div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>最近回读</h2></div>
      <div class="panel-body" style="padding-top:4px">
        ${all.filter(r=>r.readback).sort((a,b)=>a.readback<b.readback?1:-1).slice(0,3).map(r=>`<div class="tl"><time>${esc(r.readback.slice(5,16))}</time><p>${esc(r.no)} ${r.erp==='APPROVED'?'已审批':'待审批'}</p></div>`).join('')||'<div class="muted" style="font-size:11px">暂无</div>'}
      </div>
    </section>
  </div>
  <section class="panel">
    <div class="panel-head"><h2>请购单据</h2><span class="sub">${rows.length} 单</span></div>

    :'<div class="empty"><h3>该状态下没有单据</h3></div>'}

`;
}
function pageReq(no){
  const r=reqs().find(x=>x.no===no);

    ['ERP 受理',r.plat==='UNKNOWN'?'结果待核对':'生成采购申请'],
    ['ERP 审批','由 ERP 角色决定'],
    ['下单收货','不在本平台']];
  const stepCls=i=>i<done?'done':(i===done&&done<3?(r.plat==='UNKNOWN'?'wait':'now'):'todo');
  const plat=r.plat==='UNKNOWN'?'已提交 · 未确认':'已提交';
  return `
  <a class="back" href="#/requisitions">← 请购管理</a>

        <div class="verdict" style="grid-template-columns:repeat(3,1fr);margin-bottom:0">

          <div class="accent"><small>最终数量</small><b>${r.finalQty}<span>${esc(r.k.unit)}</span></b></div>

        </div>
        <dl class="kv" style="margin-top:10px">
          <div><dt>调整原因</dt><dd>${r.reason?esc(r.reason):'原样确认'}</dd></div>

          <div><dt>建议来源</dt><dd>${SOURCE[r.k.source]}</dd></div>
          <div><dt>首次短缺</dt><dd>${r.k.plan.firstShortage?r.k.plan.firstShortage.slice(5):'—'}</dd></div>
        </dl>
        <a class="btn sm" style="margin-top:10px" href="#/sku/${encodeURIComponent(r.k.key)}">查看 SKU 依据</a>
      </div></section>
    <div>
      <section class="panel"><div class="panel-head"><h2>单据</h2></div>
        <div class="panel-body"><dl class="meta-list">
          <dt>单据号</dt><dd class="mono">${esc(r.no)}</dd>
          <dt>平台状态</dt><dd>${plat}</dd>
          <dt>ERP 状态</dt><dd>${r.erp==='APPROVED'?'已审批':r.erp==='UNKNOWN'?'未知':'待审批'}</dd>
          <dt>独立回读</dt><dd>${r.readback?esc(r.readback.slice(5)):'未确认'} · ${r.reads} 次</dd>
          ${r.approver?`<dt>审批角色</dt><dd>${esc(r.approver)}</dd>`:''}
        </dl>
        ${r.plat!=='UNKNOWN'?'<button class="btn sm" style="width:100%;margin-top:8px" data-act="refresh">重新回读</button>':''}
        <div class="rail-note">状态来自提交后的独立回读，平台不执行审批。</div>
      </div></section>
      <section class="panel"><div class="panel-head"><h2>记录</h2></div>
        <div class="panel-body" style="padding-top:4px">
          <div class="tl"><time>${esc(r.at.slice(11))}</time><p>${esc(r.by)} 确认 ${r.finalQty} ${esc(r.k.unit)} 并提交</p></div>
          ${r.plat!=='UNKNOWN'?`<div class="tl"><time>${esc(r.at.slice(11))}</time><p>已提交 ERP，进入审批</p></div>`:''}
          ${r.erp==='APPROVED'?`<div class="tl"><time>${esc(r.readback.slice(11))}</time><p>回读确认为已审批</p></div>`:''}
          ${r.plat==='UNKNOWN'?`<div class="tl"><time>${esc(r.at.slice(11))}</time><p>提交结果未确认，待原单核对</p></div>`:''}
        </div></section>
    </div>
  </div>`;
}

/* ================= 渲染 ================= */
function render(){
  const r=state.route;
  sidebar();crumb();
  const main=document.getElementById('main');
  if(r.page==='sku')main.innerHTML=pageDetail(r.id);
  else if(r.page==='requisitions'&&r.id)main.innerHTML=pageReq(r.id);
  else if(r.page==='suggestions')main.innerHTML=pageList();
  else if(r.page==='requisitions')main.innerHTML=pageReqs();
  else main.innerHTML=pageWorkbench();
  if(r.page==='suggestions'){paintRows();bindFilters();restoreScroll();}
  if(r.page==='sku')bindDetail();
}
function bindFilters(){
  const q=document.getElementById('f-q');if(!q)return;
  q.addEventListener('input',()=>{state.filters.q=q.value;saveFilters();paintRows();});
  ['store','wh','source'].forEach(k=>{
    const el=document.getElementById('f-'+k);
    if(el)el.addEventListener('change',()=>{state.filters[k]=el.value;saveFilters();paintRows();});
  });
}
function bindDetail(){
  const s=byKey(state.route.id);if(!s)return;
  const q=document.getElementById('qty');
  if(q)q.addEventListener('input',()=>{state.qty[s.key]=q.value;refreshRail(s);});
  const r=document.getElementById('reason');
  if(r)r.addEventListener('input',()=>{state.reason[s.key]=r.value;refreshRail(s);});
  const a=document.getElementById('ack');
  if(a)a.addEventListener('change',()=>{state.ack[s.key]=a.checked;refreshRail(s);});
}
function refreshRail(s){
  const q=state.qty[s.key];
  const c=document.getElementById('rail-check');if(c)c.innerHTML=railCheck(s,q);
  const w=document.getElementById('reason-wrap');if(w)w.hidden=String(q)===String(s.plan.suggest);
  const b=document.getElementById('submit');if(b)b.disabled=!railValid(s,q);
}
function restoreScroll(){if(state.listScroll>0){window.scrollTo(0,state.listScroll);state.listScroll=0;}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast._);toast._=setTimeout(()=>t.hidden=true,3800);}
function dialog(title,body,foot){
  document.getElementById('dialog-inner').innerHTML=
    `<div class="dlg-head"><h2>${esc(title)}</h2><button class="close" data-act="x" aria-label="关闭">×</button></div>
     <div class="dlg-body">${body}</div>${foot?`<div class="dlg-foot">${foot}</div>`:''}`;
  const d=document.getElementById('dialog');if(!d.open)d.showModal();
}
function dlgClose(){const d=document.getElementById('dialog');if(d.open)d.close();}

/* ================= 事件 ================= */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,s=state.route.page==='sku'?byKey(state.route.id):null;
  if(act==='back'){state.listScroll=window.scrollY;return;}
  if(act==='stage'){
    state.filters.stage=el.dataset.group;saveFilters();
    if(state.route.page!=='suggestions')go('/suggestions');else render();return;
  }
  if(act==='seg'){
    state.filters.stage=el.dataset.val||'';saveFilters();
    [...el.parentElement.querySelectorAll('button')].forEach(b=>b.setAttribute('aria-pressed',String(b===el)));
    paintRows();return;
  }
  if(act==='clear'){state.filters={q:'',store:'',wh:'',source:'',stage:''};saveFilters();render();return;}
  if(act==='tab'){
    const t=el.dataset.tab;state.tab=t;
    history.replaceState(null,'','#/sku/'+encodeURIComponent(s.key)+(t==='conditions'?'':'/'+t));
    const y=window.scrollY;render();window.scrollTo(0,y);return;
  }
  if(act==='step'){
    const inc=Number(el.dataset.v),cur=Number(state.qty[s.key]||s.plan.suggest);
    let n=cur+inc;if(n<s.constraints.moq)n=s.constraints.moq;
    state.qty[s.key]=n;
    const q=document.getElementById('qty');if(q)q.value=n;
    refreshRail(s);return;
  }
  if(act==='confirm'){
    ev.preventDefault();
    const q=Number(state.qty[s.key]);
    if(railError(s,q)||!state.ack[s.key])return;
    const rec={no:'RQ-2026-0014',plat:'SUBMITTED',erp:'PENDING',finalQty:q,sugQty:s.plan.suggest,
      reason:(state.reason[s.key]||'').trim(),at:'2026-11-14 10:20',by:'林予',readback:'2026-11-14 10:20',reads:1,step:1};
    SKUS.find(x=>x.key===s.key).req=rec;   /* 写入源数据，派生视图下次渲染仍可见 */
    state.ack[s.key]=false;state.reason[s.key]='';
    render();toast(`已提交 ${rec.no}，等待 ERP 审批`);return;
  }
  if(act==='batch'){
    dialog('检查批次',`<div class="tw"><table><thead><tr><th>时间</th><th class="r">对象</th><th>状态</th><th></th></tr></thead><tbody>
      ${BATCHES.map(b=>`<tr><td class="num">${b.at}</td><td class="r num">${b.objects}</td>
        <td>${b.complete?'<span class="chip ok">完整</span>':'<span class="chip warn">部分完成</span>'}</td>
        <td class="r">${b.id===state.batchId?'<span class="chip line">当前</span>':`<button class="btn sm" data-act="switch" data-id="${b.id}">切换</button>`}</td></tr>`).join('')}
      </tbody></table></div>`,'<button class="btn" data-act="x">关闭</button>');return;
  }
  if(act==='switch'){state.batchId=el.dataset.id;dlgClose();render();toast(`已切换到 ${batch().at} 批次`);return;}
  if(act==='rerun'){dialog('重新检查',`<p>重新读取该范围的库存、销量与采购条件并重算建议。只读，不创建采购。</p>`,
    '<button class="btn" data-act="x">取消</button><button class="btn primary" data-act="x">开始</button>');return;}
  if(act==='single'){dialog('新建单品分析',`<p>将重新读取该 SKU 的 ERP 事实，并按需生成 AI 解读。查看详情本身不读取 ERP。</p>`,
    '<button class="btn" data-act="x">取消</button><button class="btn primary" data-act="x">开始</button>');return;}
  if(act==='evidence'){
    dialog('本次判定使用的字段',`<dl class="meta-list">
      <dt>可用库存</dt><dd>${dash(s.plan.available)} ${esc(s.unit)}</dd>
      <dt>仓库</dt><dd>${esc(s.wh)}</dd>
      <dt>销量窗口</dt><dd>${s.plan.window||'—'}</dd>
      <dt>完整业务日</dt><dd>${s.plan.salesDays||0}</dd>
      <dt>报价</dt><dd>${esc(s.constraints.quote||'—')}</dd>
      <dt>读取时点</dt><dd>${batch().at}</dd></dl>`,'<button class="btn primary" data-act="x">关闭</button>');return;}
  if(act==='hist'){dialog('历史分析','<p>历史版本按当时快照保留，不能直接复用为当前结论。</p>','<button class="btn primary" data-act="x">知道了</button>');return;}
  if(act==='reqtab'){state.reqTab=el.dataset.v;render();return;}
  if(act==='refresh'){el.disabled=true;el.textContent='回读中…';setTimeout(()=>{render();toast('已回读 ERP 状态');},600);return;}
  if(act==='recheck'){dialog('使用原单核对',`<p>按原业务号查询 ERP 是否已建单，不创建第二张申请。</p>
    <dl class="meta-list"><dt>核对对象</dt><dd class="mono">RQ-2026-0012</dd><dt>已核对</dt><dd>1 次</dd></dl>`,
    '<button class="btn" data-act="x">取消</button><button class="btn primary" data-act="x">开始核对</button>');return;}
  if(act==='x'){dlgClose();return;}
});
document.getElementById('dialog').addEventListener('click',e=>{if(e.target.id==='dialog')dlgClose();});
/* 诊断钩子：校验每个批次的建议数量是否等于 目标-可用 经 MOQ/整箱取整后的值 */
window.__ux3check=()=>{
  const bad=[];
  BATCHES.forEach(b=>{
    SKUS.forEach(s0=>{
      if(s0.source!=='RULE')return;
      const o=b.over[s0.key]||{};if(o.missing)return;
      const s=Object.assign({},s0,{plan:Object.assign({},s0.plan,o)});
      if(!s.plan.suggest)return;
      const c=s.constraints,gap=Math.max(0,(s.plan.target||0)-s.plan.available);
      const qty=Math.max(Math.ceil(gap/(c.mult||1))*(c.mult||1),c.moq||0);
      if(qty!==s.plan.suggest)bad.push(b.id+'/'+s.sku+' expect '+qty+' got '+s.plan.suggest);
    });
  });
  return bad;
};
window.addEventListener('hashchange',onRoute);
if(!location.hash)location.replace('#/workbench');
onRoute();
})();
</script>
